<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>SOMA//KERNEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* SOMA//KERNEL — one dark world: neon instrument panel over a living mandala.
   layout: HUD / main (soma map + panel) / tab bar; single column on phones, two on wide screens */
:root{
  color-scheme:dark;
  --bg:#04060b; --bg2:#080c15; --panel:#0b101b; --panel2:#0f1524; --line:#19233a; --line2:#27354f;
  --ink:#dfe8f7; --dim:#8492ab; --mute:#4d5a73;
  --cy:#5ad1ff; --mg:#ff4fa0; --am:#ffcf6a; --gr:#54e3b0; --vi:#c58bff; --rd:#ff5d5d;
  --f-ui:"Chakra Petch","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.25;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--cy);outline-offset:1px}
svg.g{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(120% 70% at 50% 0%,#0b1322 0%,var(--bg) 60%)}

/* ---------- HUD ---------- */
#hud{flex:none;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(13,19,33,.96),rgba(7,10,18,.96));padding:5px 10px 6px;display:grid;gap:5px}
.h1{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--ink);white-space:nowrap}
.brand i{color:var(--mg);font-style:normal}
.clock{font-family:var(--f-num);font-size:11px;color:var(--dim);margin-left:2px;white-space:nowrap}
.spd{margin-left:auto;display:flex;gap:3px}
.spd button,.ibtn{width:30px;height:26px;border:1px solid var(--line2);border-radius:5px;display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.spd button.on{color:var(--bg);background:var(--cy);border-color:var(--cy)}
.spd svg,.ibtn svg{width:14px;height:14px;fill:currentColor}
.ibtn{font-weight:700;font-size:13px}
.h2{display:flex;align-items:center;gap:10px}
#brain{position:relative;width:50px;height:50px;flex:none}
#brain svg{width:50px;height:50px;transform:rotate(-90deg)}
#brain .trk{fill:none;stroke:var(--line2);stroke-width:4}
#brain .arc{fill:none;stroke:var(--gr);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .3s,stroke .3s}
#brain .lim{fill:none;stroke:var(--rd);stroke-width:6;stroke-dasharray:1.2 200}
#brain b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:600}
#brain.crit b{color:var(--rd);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hmid{flex:1;min-width:0;display:grid;gap:4px}
.ebar{display:flex;align-items:center;gap:6px}
.ebar .lab{color:var(--am);font-weight:700;font-size:11px;letter-spacing:.08em}
.ebar .trk{flex:1;height:9px;border-radius:5px;background:#0a0f1a;border:1px solid var(--line2);overflow:hidden;display:flex}
.ebar .trk i{display:block;height:100%}
.ebar .s1{background:var(--cy)} .ebar .s2{background:var(--am)} .ebar .s3{background:#a9772e}
.ebar .v{font-family:var(--f-num);font-size:12px;min-width:38px;text-align:right}
.ebar .d{font-family:var(--f-num);font-size:10px;color:var(--dim);min-width:40px;text-align:right}
.ebar .d.neg{color:var(--rd)} .ebar .d.pos{color:var(--gr)}
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.vit span{border:1px solid var(--line);border-radius:4px;padding:1px 5px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;background:rgba(12,17,28,.7)}
.vit em{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.06em}
.vit b{font-family:var(--f-num);font-weight:500;font-size:12px}
.vit .warn{border-color:#6b5320}.vit .warn b{color:var(--am)}
.vit .crit{border-color:#7a2a35}.vit .crit b{color:var(--rd)}
.h3{display:flex;align-items:center;gap:6px;min-width:0}
.phc{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:6px;padding:2px 7px 2px 4px;min-width:0;flex:1;position:relative;overflow:hidden;background:var(--panel);min-height:29px}
.phc.bad{border-color:#5a2740}.phc.good{border-color:#1f5a4b}
.phc .pr{position:absolute;left:0;bottom:0;height:2px;background:var(--cy)}
.phc.bad .pr{background:var(--mg)} .phc.good .pr{background:var(--gr)}
.phc svg{width:20px;height:20px;flex:none}
.phc .nm{font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phc .lv{font-family:var(--f-num);font-size:10px;color:var(--dim);margin-left:auto;white-space:nowrap}
.pq{display:flex;gap:3px;flex:none}
.pq span{width:27px;height:27px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;position:relative;color:var(--dim)}
.pq span.bad{color:#ff8fbd;border-color:#3d2233}.pq span.good{color:#7fe9c6;border-color:#1c3c36}
.pq svg{width:16px;height:16px}
.pq sub{position:absolute;right:1px;bottom:-1px;font-family:var(--f-num);font-size:8px;color:var(--dim)}
svg.pi{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
.phw{position:relative;flex:1;min-width:0;display:flex}
#tick{position:absolute;inset:0;border-radius:6px;display:none;align-items:center;gap:7px;padding:0 9px 0 6px;background:#0c1322;border:1px solid var(--line2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--ink);animation:tin .2s ease-out}
#tick.on{display:flex}#tick.bad{border-color:#7a2f52;color:#ffb3d1;background:#1a0c18}#tick.good{border-color:#23705c;color:#9af0d4;background:#08171a}
#tick span{overflow:hidden;text-overflow:ellipsis}
.phc.flash{animation:pflash .9s ease-out}
@keyframes pflash{0%{box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 26px rgba(255,255,255,.5)}100%{box-shadow:none}}

/* ---------- main / views ---------- */
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#070a12}
#nav button{height:46px;display:grid;place-items:center;gap:0;color:var(--mute);font-size:9px;letter-spacing:.18em;position:relative}
#nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--cy)}
#nav button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#nav button .dot{position:absolute;top:7px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--mg);box-shadow:0 0 6px var(--mg);display:none}
#nav button.alert .dot{display:block}

/* ---------- SOMA ---------- */
#bodyWrap{position:relative;flex:0 0 52%;min-height:210px;overflow:hidden;border-bottom:1px solid var(--line)}
#bodyCv{position:absolute;inset:0;width:100%;height:100%}
.org{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.org .ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.org .trk{fill:rgba(6,9,16,.78);stroke:var(--line2);stroke-width:2.5}
.org .arc{fill:none;stroke:var(--cy);stroke-width:2.5;stroke-linecap:round}
.org .inf{fill:none;stroke:var(--mg);stroke-width:2.5}
.org .tum{fill:none;stroke:var(--vi);stroke-width:2.5}
.org svg.g{width:26px;height:26px;position:relative}
.org.sel .trk{stroke:var(--ink)}
.org.sel::after{content:"";position:absolute;inset:-5px;border:1px solid rgba(223,232,247,.55);border-radius:50%}
.org.low svg.g{color:var(--rd)!important}
.org i{position:absolute;right:-4px;top:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--mg);color:#12060c;font:600 9px var(--f-num);display:none;place-items:center;padding:0 3px;font-style:normal}
.org i.on{display:grid}
.org u{position:absolute;left:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--vi);display:none;text-decoration:none}
.org u.on{display:block;box-shadow:0 0 8px var(--vi)}
#detail{flex:1;min-height:0;overflow:auto;padding:8px 10px 14px;display:grid;gap:9px;align-content:start;-webkit-overflow-scrolling:touch}
.dh{display:flex;align-items:center;gap:8px}
.dh h2{margin:0;font-size:13px;letter-spacing:.18em;font-weight:600}
.dh .fn{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--dim)}
.tb{height:10px;border-radius:5px;overflow:hidden;display:flex;background:#1a0d14;border:1px solid var(--line2)}
.tb i{display:block;height:100%}
.tb .h{background:linear-gradient(90deg,#2aa5c7,var(--cy))}.tb .i{background:var(--mg)}.tb .t{background:var(--vi)}
.sec{display:grid;gap:5px}
.sec>h3{margin:0;font-size:9px;letter-spacing:.22em;color:var(--mute);font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.sgc{border:1px solid var(--line);border-radius:5px;padding:3px 2px 2px;display:grid;justify-items:center;gap:1px;background:var(--panel)}
.sgc svg.g{width:18px;height:18px}
.sgc b{font:500 10px var(--f-num);color:var(--dim)}
.sgc .lv{width:26px;height:3px;background:#101828;border-radius:2px;overflow:hidden}
.sgc .lv s{display:block;height:100%;background:currentColor}
.sgc.z{opacity:.38}
.cl{display:grid;gap:3px}
.cr{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--panel)}
.cr svg.g{width:19px;height:19px}
.cr .n{font:500 12px var(--f-num);min-width:44px}
.cr .sb{flex:1;height:6px;border-radius:3px;overflow:hidden;display:flex;background:#101828}
.cr .sb i{display:block;height:100%}
.cr .st{display:flex;gap:4px;font:400 10px var(--f-num);color:var(--dim)}
.thr{border:1px solid #4a2238;border-radius:6px;padding:6px 7px;background:linear-gradient(180deg,rgba(40,12,28,.55),rgba(14,10,20,.6));display:grid;gap:5px}
.thr.tu{border-color:#3d2a5c;background:linear-gradient(180deg,rgba(32,18,56,.55),rgba(12,10,22,.6))}
.thr .t1{display:flex;align-items:center;gap:7px}
.thr .t1 svg.pi{width:20px;height:20px;color:#ff8fbd}
.thr.tu .t1 svg.pi{color:var(--vi)}
.thr .t1 b{font:600 12px var(--f-num)}
.thr .t1 span{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.thr .t1 em{margin-left:auto;font:400 10px var(--f-num);color:var(--dim);font-style:normal}
.trs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:3px 8px}
.trs span{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:4px;font:400 9px var(--f-num);color:var(--dim)}
.trs span.up{color:var(--am)}
.trs s{display:block;height:4px;background:#1b1422;border-radius:2px;overflow:hidden;text-decoration:none}
.trs s i{display:block;height:100%;background:#ff8fbd}
.trs span.up s i{background:var(--am)}
.kbs{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.kbs span{display:grid;justify-items:center;gap:1px}
.kbs svg.g{width:15px;height:15px}
.kbs s{display:block;width:16px;height:14px;position:relative;text-decoration:none;background:#151022;border-radius:2px;overflow:hidden}
.kbs s i{position:absolute;left:0;right:0;bottom:0;background:var(--cy)}
svg.sig{width:22px;height:22px;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:3px 10px}
.kv span{display:flex;justify-content:space-between;font:400 10px var(--f-num);color:var(--dim);border-bottom:1px dotted var(--line)}
.kv b{color:var(--ink);font-weight:500}
.abr{display:flex;flex-wrap:wrap;gap:4px}
.abr span{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:5px;padding:1px 5px 1px 2px;font:400 10px var(--f-num);color:var(--dim)}
.abr svg.g{width:15px;height:15px}

/* ---------- CODE ---------- */
#cells{flex:none;display:flex;gap:4px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);scrollbar-width:none}
#cells::-webkit-scrollbar{display:none}
.cb{flex:none;width:42px;height:44px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;position:relative;background:var(--panel);padding-bottom:5px}
.cb svg.g{width:24px;height:24px}
.cb.on{border-color:var(--ink);background:var(--panel2);box-shadow:0 0 0 1px rgba(223,232,247,.25) inset}
.cb .pl{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:#131b2c;overflow:hidden}
.cb .pl i{display:block;height:100%;background:var(--gr)}
.cb .bd{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;display:none}
.cb.mut .bd{display:block;background:var(--mg);box-shadow:0 0 6px var(--mg)}
.cb.pend .bd{display:block;background:var(--am);box-shadow:0 0 6px var(--am)}
.cb.drt{border-style:dashed}
#chead{flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);min-height:34px}
#chead h2{margin:0;font-size:12px;letter-spacing:.16em;font-weight:600;white-space:nowrap}
#chead .cnt{font:400 11px var(--f-num);color:var(--dim)}
#stleg{display:flex;gap:6px;margin-left:auto;align-items:center;overflow-x:auto;scrollbar-width:none}
#stleg span{display:flex;align-items:center;gap:2px;font-size:9px;color:var(--dim);white-space:nowrap;letter-spacing:.04em}
#stleg svg.g{width:14px;height:14px}
#probe{flex:none;display:flex;gap:3px;padding:4px 8px;border-bottom:1px solid var(--line);align-items:center;overflow-x:auto;scrollbar-width:none}
#probe em{font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--mute);margin-right:3px}
#probe button{width:30px;height:24px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;color:var(--dim);font:600 11px var(--f-num)}
#probe button svg.g{width:16px;height:16px;color:inherit!important}
#probe button.on{border-color:var(--cy);color:var(--cy);background:rgba(90,209,255,.08)}
#probe button.z{opacity:.3}
#code{flex:1;min-height:0;overflow:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.wide.edk #code{box-shadow:inset 2px 0 0 rgba(90,209,255,.55)}
.ln{display:flex;align-items:flex-start;gap:0;padding:1px 6px 1px 0;border-left:2px solid transparent}
.ln.cur{background:rgba(90,209,255,.045);border-left-color:var(--cy)}
.ln.err{border-left-color:var(--rd);background:rgba(255,93,93,.05)}
.ln.new{border-left-color:var(--gr)}
.gut{flex:none;width:36px;height:30px;display:grid;grid-template-columns:16px 14px;align-items:center;justify-items:end;gap:3px;color:var(--mute);font:400 9px var(--f-num)}
.gut .led{width:5px;height:22px;border-radius:2px;background:#101828;position:relative;overflow:hidden;justify-self:start;margin-left:3px}
.gut .led i{position:absolute;left:0;right:0;bottom:0;background:var(--gr);box-shadow:0 0 6px var(--gr)}
.gut .led.g1{background:#16283a}
.tks{flex:1;display:flex;flex-wrap:wrap;gap:2px;min-height:30px;align-items:center}
.tk{width:29px;height:29px;border-radius:5px;display:grid;place-items:center;position:relative;border:1px solid transparent}
.tk svg.g{width:21px;height:21px}
.tk.c-sen,.tk.c-sig,.tk.c-hor,.tk.c-dual,.tk.c-cell,.tk.c-comp{background:rgba(143,214,255,.055)}
.tk.c-act,.tk.c-verb,.tk.c-ig,.tk.c-halt{background:rgba(255,255,255,.06)}
.tk.c-state{background:rgba(205,188,255,.09)}
.tk.c-arrow{width:34px}
.tk.c-arrow svg.g{width:26px;height:22px}
.tk.c-num{font:600 15px var(--f-num);color:#ffd98a;width:22px}
.tk.r-arg{background:rgba(255,217,138,.1)}
.tk.sel{border-color:var(--ink);background:rgba(223,232,247,.14);box-shadow:0 0 10px rgba(90,209,255,.35)}
.tk.bad{border-color:var(--rd);background:rgba(255,93,93,.18)}
.tk.mut{animation:glitch .9s steps(3) infinite;border-color:var(--mg)}
@keyframes glitch{0%{transform:translate(0,0)}33%{transform:translate(1px,-1px)}66%{transform:translate(-1px,1px)}}
.caret{width:2px;height:22px;background:var(--cy);border-radius:1px;animation:blink 1s steps(2) infinite;margin:0 -3px 0 -1px;position:relative;z-index:1;flex:none}
#insp{flex:none;display:flex;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid var(--line);min-height:36px;background:#070b13}
#insp .big svg.g{width:24px;height:24px}
#insp .tag{font-size:11px;letter-spacing:.1em;color:var(--ink);white-space:nowrap}
#insp .tag.unk{color:var(--mute)}
#insp .cls{font-size:8px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
#insp .lv7{display:flex;gap:3px;margin-left:auto}
#insp .lv7 span{display:grid;justify-items:center;font:500 10px var(--f-num);color:var(--dim);min-width:17px}
#insp .lv7 span svg.g{width:12px;height:12px;color:var(--mute)!important}
#insp .lv7 span.hot{color:var(--cy)}
#insp .step{display:flex;gap:4px;margin-left:auto}
#insp .step button{width:34px;height:26px;border:1px solid var(--line2);border-radius:5px;font:600 14px var(--f-num)}
#insp .msg{margin-left:auto;font-size:10px;letter-spacing:.08em;color:var(--am)}
#tools{flex:none;display:flex;gap:4px;padding:5px 8px;border-top:1px solid var(--line);align-items:center;background:#070b13}
#tools button{height:32px;min-width:30px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;color:var(--dim);background:var(--panel);padding:0 4px}
#tools button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.on{color:var(--cy);border-color:var(--cy)}
#tools button:disabled{opacity:.3}
#commit{margin-left:auto;gap:6px;grid-auto-flow:column;padding:0 9px!important;white-space:nowrap;min-width:84px;font:600 11px var(--f-num);letter-spacing:.06em;color:var(--mute)!important}
#commit.rdy{color:#04110d!important;background:var(--gr)!important;border-color:var(--gr)!important;box-shadow:0 0 14px rgba(84,227,176,.45)}
#commit.no{color:var(--rd)!important;border-color:#6d2b36!important}
#commit.busy{color:var(--am)!important;border-color:#6b5320!important}
#pal{flex:none;border-top:1px solid var(--line);background:#060910}
#ptabs{display:flex;gap:2px;padding:4px 8px 0;overflow-x:auto;scrollbar-width:none}
#ptabs button{flex:1;min-width:38px;height:26px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;display:grid;place-items:center;color:var(--mute)}
#ptabs button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ptabs button.on{color:var(--ink);background:var(--panel2);border-color:var(--line2)}

/* ---------- SCOPE / CODEX ---------- */

/* ---------- overlays ---------- */
#ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,5,10,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;padding:16px;overflow:auto}

.card{width:min(460px,100%);border:1px solid var(--line2);border-radius:12px;background:linear-gradient(180deg,#0d1424,#080c16);padding:18px 16px 16px;display:grid;gap:12px;box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 0 1px rgba(90,209,255,.06) inset}

.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2 div{border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--panel)}

.btn{height:44px;border-radius:8px;border:1px solid var(--cy);color:#03121a;background:var(--cy);font-weight:700;letter-spacing:.24em;font-size:13px;box-shadow:0 0 22px rgba(90,209,255,.35)}
.btn.ghost{background:none;color:var(--dim);border-color:var(--line2);box-shadow:none}
.card canvas{width:100%;height:70px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.seedrow{display:flex;gap:8px;align-items:center;font:400 10px var(--f-num);color:var(--mute)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- wide screens: body map stays, panel beside it ---------- */
body.wide #main{display:grid;grid-template-columns:minmax(380px,40%) 1fr}

.odp[data-k="ALV"] .cn s i{background:#8ef0e0}
.ecg.srnw{height:128px;border-color:#3a3f17;background:radial-gradient(60% 80% at 50% 55%,rgba(217,227,106,.07),transparent 70%),linear-gradient(rgba(217,227,106,.05) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(217,227,106,.05) 1px,transparent 1px) 0 0/12px 12px,#0b0b05}
.ecg.srnw .hrv{color:#d9e36a;text-shadow:0 0 8px rgba(217,227,106,.55)}

.odp[data-k="SRN"] .cn{border-color:#3d4220;background:linear-gradient(180deg,rgba(44,48,14,.55),rgba(10,12,18,.6));flex-basis:40px}
.odp[data-k="SRN"] .cn b{color:#d9e36a}
.odp[data-k="SRN"] .cn s i{background:#d9e36a}
.ecg.thyw{height:128px;border-color:#30244a;background:radial-gradient(60% 80% at 40% 55%,rgba(180,140,255,.08),transparent 70%),linear-gradient(rgba(180,140,255,.05) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(180,140,255,.05) 1px,transparent 1px) 0 0/12px 12px,#07050d}
.ecg.thyw .hrv{color:#c9a8ff;text-shadow:0 0 8px rgba(180,140,255,.55)}
.ecg.thyw .hrv::after{content:'FT4 ng/dL';display:block;font:600 8px var(--f-ui);letter-spacing:.2em;text-align:right;opacity:.7}
.ecg.thyw .rhv.r0{color:#c9a8ff}
.odp[data-k="THY"] .cn{border-color:#33264d;background:linear-gradient(180deg,rgba(36,22,60,.55),rgba(10,12,18,.6));flex-basis:40px}
.odp[data-k="THY"] .cn b{color:#c9a8ff}
.odp[data-k="THY"] .cn s i{background:#b48cff}
.ecg.lobw{height:132px;border-color:#3d2c18;background:radial-gradient(60% 80% at 42% 55%,rgba(232,166,92,.08),transparent 70%),linear-gradient(rgba(232,166,92,.05) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(232,166,92,.05) 1px,transparent 1px) 0 0/12px 12px,#0b0805}
.ecg.lobw .hrv{color:#f2bd7c;text-shadow:0 0 8px rgba(232,166,92,.5)}
.ecg.lobw .hrv::after{content:'T-BIL mg/dL';display:block;font:600 8px var(--f-ui);letter-spacing:.2em;text-align:right;opacity:.7}
.ecg.lobw .rhv.r0{color:#f2bd7c}
.odp[data-k="LOB"] .cn{border-color:#433018;background:linear-gradient(180deg,rgba(60,40,18,.55),rgba(10,12,18,.6));flex-basis:40px}
.odp[data-k="LOB"] .cn b{color:#f2bd7c}
.odp[data-k="LOB"] .cn s i{background:#e8a65c}
.ecg.spnw{height:124px;border-color:#43202a;background:radial-gradient(60% 80% at 45% 55%,rgba(224,96,124,.09),transparent 70%),linear-gradient(rgba(224,96,124,.05) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(224,96,124,.05) 1px,transparent 1px) 0 0/12px 12px,#0c0507}
.ecg.spnw .hrv{color:#ff8fa6;text-shadow:0 0 8px rgba(224,96,124,.5)}
.ecg.spnw .hrv::after{content:'SPLEEN mL';display:block;font:600 8px var(--f-ui);letter-spacing:.2em;text-align:right;opacity:.7}
.ecg.spnw .rhv.r0{color:#ff8fa6}
.odp[data-k="SPN"] .cn{border-color:#4a2230;background:linear-gradient(180deg,rgba(64,20,32,.55),rgba(10,12,18,.6));flex-basis:40px}
.odp[data-k="SPN"] .cn b{color:#ff8fa6}
.odp[data-k="SPN"] .cn s i{background:#e0607c}
.seg{border:1px solid var(--line);border-radius:6px;padding:4px 5px;background:var(--panel);display:grid;gap:3px;align-content:start;min-width:0}
.seg em{font-style:normal;font-size:8.5px;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg em svg.g{width:12px;height:12px}
.sd{display:grid;gap:2px}

.cn{flex:1 0 56px;border:1px solid #3c3320;border-radius:5px;padding:3px 4px;background:linear-gradient(180deg,rgba(40,32,12,.5),rgba(12,12,18,.6));display:grid;gap:2px}
.cn em{font-style:normal;font-size:7.5px;letter-spacing:.1em;color:var(--dim);white-space:nowrap}
.cn b{font:600 11px var(--f-num);color:var(--am)}
.cn s{height:3px;border-radius:2px;background:#101828;overflow:hidden}
.cn s i{display:block;height:100%;background:var(--am)}
.ca{align-self:center;color:var(--mute);font-size:12px}
.mts{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:3px 12px}

}

/* ---------- ICU bedside monitor ---------- */

<body>
<div id="app">
  <header id="hud">
    <div class="h1"><span class="brand">SOMA<i>//</i>KERNEL</span><span class="clock" id="clock"></span><div class="spd" id="spd"></div><button class="ibtn snd" id="sndBtn" aria-label="sound"></button><button class="ibtn" id="helpBtn" aria-label="help">?</button></div>
    <div class="h2">
      <div id="brain" role="img" aria-label="brain function"></div>
      <div class="hmid">
        <div class="ebar"><span class="lab">ENERGY</span><div class="trk"><i class="s1" id="eS1"></i><i class="s2" id="eS2"></i><i class="s3" id="eS3"></i></div><span class="v" id="eV"></span><span class="d" id="eD"></span></div>
        <div class="vit" id="vit"></div>
      </div>
    </div>
    <div class="h3"><div class="phw"><div class="phc" id="phc"></div><div id="tick" aria-live="polite"></div></div><div class="pq" id="pq"></div></div>
  </header>
  <main id="main">
    <section class="view on" id="v-soma"><div id="bodyWrap"><canvas id="bodyCv"></canvas></div><div id="detail"></div></section>

/* log level 0..9 : 0.5→1, 1→2, 2→3, 4→4, 8→5, 16→6, 32→7, 64→8, 128→9 */
const lvl = x => x < 0.5 ? 0 : Math.min(9, 1 + Math.floor(Math.log2(x / 0.5) + 1e-9));
/* ratio level : 1.0 → 5 */
const rl = x => clamp(Math.floor(5 * x + 0.5), 0, 9);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

const TOKS = [], TKB = {};
function tk(id, cls, tag, col, svg, extra) {

/* ---- continuous number literals: token id '#<value>' (6 decimal places, ±999999.999999) ---- */
const NUM_MAX = 999999.999999;
function fmtNum(v) {
  if (!isFinite(v)) v = 0;
  v = clamp(v, -NUM_MAX, NUM_MAX);
  let s = (Math.round(v * 1e6) / 1e6).toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s;
}

function numTok(id) {
  let o = NUMT.get(id);

/* ============================================================
   parser
   rule   := state* guard? (DET | STO expr) action+
   action := HALT | state | SEC obj expr | MAKE obj expr | reg regop expr | effector expr
   expr   := or ;  or := and (OR and)* ;  and := not (AND not)* ;  not := NOT not | cmp
   cmp    := sum (cmpop sum)? ;  sum := prod ((ADD|SUB) prod)* ;  prod := unary ((MUL|DIV) unary)*
   unary  := SUB unary | number | register | sensor | place | LP expr RP
   values are real numbers in physical units; comparisons and logic yield 1 / 0
   ============================================================ */
const CMPOPS = { GT: 1, LT: 1, GE: 1, LE: 1, EQ: 1, NE: 1 };
function parseRule(toks, type) {
  const D = DIALECT[type], n = toks.length, roles = new Array(n).fill('');
  let i = 0, err = null, inArg = false;
  const fail = (pos, code) => { if (!err) err = { pos: Math.max(0, Math.min(pos, n - 1)), code }; return null; };
  if (n === 0) return { ok: true, empty: true, roles, rule: null };
  for (let j = 0; j < n; j++) if (!TK[toks[j]]) return { ok: false, err: { pos: j, code: 'tok' }, roles };
  let mask = 0;
  while (i < n && TK[toks[i]].cls === 'state') {
    const si = TK[toks[i]].si;
    if (D.states.indexOf(si) < 0) { fail(i, 'state'); break; }
    mask |= 1 << si; roles[i] = 'sf'; i++;
  }
  if (err) return { ok: false, err, roles };
  if (!mask) mask = 31;
  const isArrow = t => t === 'DET' || t === 'STO';
  let depth = 0;
  function unary() {
    if (i >= n) return fail(n - 1, 'val');
    const t = toks[i], k = TK[t];
    if (t === 'LP') {
      if (++depth > 12) return fail(i, 'deep');
      roles[i] = 'op'; i++;
      const e = orx(); depth--; if (!e) return null;
      if (i >= n || toks[i] !== 'RP') return fail(i >= n ? n - 1 : i, 'paren');
      roles[i] = 'op'; i++; return e;
    }
    if (t === 'SUB') { roles[i] = 'op'; i++; const a = unary(); if (!a) return null; return { k: 'neg', a }; }
    if (k.cls === 'num') { roles[i] = inArg ? 'arg' : 'thr'; i++; return { k: 'n', v: k.v }; }
    if (k.cls === 'reg') { roles[i] = 'reg'; i++; return { k: 'r', i: k.ri }; }
    if (k.cls === 'comp' && !D.compVal && !D.noLoc) { roles[i] = 'loc'; i++; return { k: 'loc', c: k.ci }; }
    if (D.sensSet.has(t)) { roles[i] = 'sen'; i++; return { k: 's', si: SENS_IX[t], id: t }; }
    return fail(i, 'val');
  }
  function prod() {
    let a = unary(); if (!a) return null;
    while (i < n && (toks[i] === 'MUL' || toks[i] === 'DIV')) {
      const op = toks[i]; roles[i] = 'op'; i++;
      const b = unary(); if (!b) return null;
      a = { k: op === 'MUL' ? 'mul' : 'div', a, b };
    }
    return a;
  }
  function sum() {
    let a = prod(); if (!a) return null;
    while (i < n && (toks[i] === 'ADD' || toks[i] === 'SUB')) {
      const op = toks[i]; roles[i] = 'op'; i++;
      const b = prod(); if (!b) return null;
      a = { k: op === 'ADD' ? 'add' : 'sub', a, b };
    }
    return a;
  }
  function cmp() {
    const a = sum(); if (!a) return null;
    if (i < n && CMPOPS[toks[i]]) {
      const op = toks[i]; roles[i] = 'op'; i++;
      const b = sum(); if (!b) return null;
      if (i < n && CMPOPS[toks[i]]) return fail(i, 'chain');
      return { k: 'cmp', op, a, b };
    }
    return a;
  }
  function notx() {
    if (i < n && toks[i] === 'NOT') { roles[i] = 'op'; i++; const a = notx(); if (!a) return null; return { k: 'not', a }; }
    return cmp();
  }
  function andx() {
    let a = notx(); if (!a) return null;
    while (i < n && toks[i] === 'AND') { roles[i] = 'op'; i++; const b = notx(); if (!b) return null; a = { k: 'and', a, b }; }
    return a;
  }
  function orx() {
    let a = andx(); if (!a) return null;
    while (i < n && toks[i] === 'OR') { roles[i] = 'op'; i++; const b = andx(); if (!b) return null; a = { k: 'or', a, b }; }
    return a;
  }
  const argx = () => { inArg = true; const e = orx(); inArg = false; return e; };
  let guard = null;
  if (i < n && !isArrow(toks[i])) { guard = orx(); if (!guard) return { ok: false, err, roles }; }
  if (i >= n || !isArrow(toks[i])) { fail(i >= n ? n - 1 : i, 'arrow'); return { ok: false, err, roles }; }
  let sto = null; roles[i] = 'arrow';
  if (toks[i] === 'STO') {
    i++;
    if (i >= n) { fail(n - 1, 'prob'); return { ok: false, err, roles }; }
    sto = argx(); if (!sto) return { ok: false, err, roles };
  } else i++;
  const acts = [];
  if (i >= n) { fail(n - 1, 'act'); return { ok: false, err, roles }; }
  while (i < n) {
    const t = toks[i], k = TK[t];
    if (k.cls === 'halt') { roles[i] = 'act'; i++; acts.push({ k: 'HALT' }); continue; }
    if (k.cls === 'state') {
      if (!D.trans || D.states.indexOf(k.si) < 0) { fail(i, 'state'); break; }
      roles[i] = 'act'; i++; acts.push({ k: 'ST', o: k.si }); continue;
    }
    if (t === 'SEC' || t === 'MAKE') {
      roles[i] = 'act'; i++;
      const set = t === 'SEC' ? D.secrSet : D.makeSet;
      if (i >= n || !set.has(toks[i])) { fail(i >= n ? n - 1 : i, 'obj'); break; }
      const o = toks[i]; roles[i] = 'obj'; i++;
      const a = argx(); if (!a) break;
      acts.push({ k: t === 'SEC' ? 'SEC' : 'MK', o, arg: a }); continue;
    }
    if (k.cls === 'reg') {
      roles[i] = 'reg'; const ri = k.ri; i++;
      if (i >= n || TK[toks[i]].cls !== 'regop') { fail(i >= n ? n - 1 : i, 'regop'); break; }
      const op = toks[i]; roles[i] = 'op'; i++;
      const a = argx(); if (!a) break;
      acts.push({ k: 'REG', o: ri, op, arg: a }); continue;
    }
    if (D.actSet.has(t)) {
      roles[i] = 'act'; i++;
      const a = argx(); if (!a) break;
      acts.push({ k: 'ACT', a: t, arg: a }); continue;
    }
    fail(i, 'act'); break;
  }
  if (err) return { ok: false, err, roles };
  return { ok: true, roles, rule: { mask, guard, sto, acts } };
}
SK.parseRule = parseRule;

/* ---------- compile AST → closures over env (all values are finite reals) ---------- */
const EQ_TOL = (x, y) => Math.abs(x - y) <= 1e-6 * Math.max(1, Math.abs(x), Math.abs(y));
function cExpr(nd) {
  switch (nd.k) {
    case 'n': { const v = nd.v; return () => v; }
    case 'r': { const i = nd.i; return e => e.reg[e.ro + i]; }
    case 's': { const si = nd.si; return e => e.sense(si); }
    case 'loc': { const cc = nd.c; return e => e.c === cc ? 1 : 0; }
    case 'neg': { const a = cExpr(nd.a); return e => -a(e); }
    case 'add': { const a = cExpr(nd.a), b = cExpr(nd.b); return e => a(e) + b(e); }
    case 'sub': { const a = cExpr(nd.a), b = cExpr(nd.b); return e => a(e) - b(e); }
    case 'mul': { const a = cExpr(nd.a), b = cExpr(nd.b); return e => a(e) * b(e); }
    case 'div': { const a = cExpr(nd.a), b = cExpr(nd.b); return e => { const d = b(e); return Math.abs(d) < 1e-12 ? 0 : a(e) / d; }; }
    case 'cmp': {
      const a = cExpr(nd.a), b = cExpr(nd.b);
      switch (nd.op) {
        case 'GT': return e => a(e) > b(e) ? 1 : 0;
        case 'LT': return e => a(e) < b(e) ? 1 : 0;
        case 'GE': return e => a(e) >= b(e) ? 1 : 0;
        case 'LE': return e => a(e) <= b(e) ? 1 : 0;
        case 'NE': return e => EQ_TOL(a(e), b(e)) ? 0 : 1;
        default: return e => EQ_TOL(a(e), b(e)) ? 1 : 0;
      }
    }
    case 'not': { const a = cExpr(nd.a); return e => a(e) > 0 ? 0 : 1; }
    case 'and': { const a = cExpr(nd.a), b = cExpr(nd.b); return e => (a(e) > 0 && b(e) > 0) ? 1 : 0; }
    case 'or': { const a = cExpr(nd.a), b = cExpr(nd.b); return e => (a(e) > 0 || b(e) > 0) ? 1 : 0; }
  }
  throw new Error('cExpr ' + nd.k);
}
/* a NaN / ±Infinity anywhere collapses to 0, huge values are clipped */
const fin = f => e => { const v = f(e); return v === v ? (v > 1e9 ? 1e9 : v < -1e9 ? -1e9 : v) : 0; };
SK.cExpr = nd => fin(cExpr(nd));
/* lines: [{id, toks, mut}]  →  {rules, errors, glyphs(set of ids used per rule)} */
function compileProgram(type, lines) {
  const rules = [], errors = [];
  lines.forEach((ln, li) => {
    const pr = parseRule(ln.toks, type);
    if (!pr.ok) { errors.push({ line: li, pos: pr.err.pos, code: pr.err.code }); return; }
    if (pr.empty) return;
    const r = pr.rule;
    const gd = r.guard ? fin(cExpr(r.guard)) : null;
    rules.push({
      li, id: ln.id, mask: r.mask, guard: gd ? (e => gd(e) > 0) : null, sto: r.sto ? fin(cExpr(r.sto)) : null,
      acts: r.acts.map(a => ({
        k: a.k, a: a.a, o: a.o, op: a.op, arg: a.arg ? fin(cExpr(a.arg)) : null, u: a.k === 'ACT' ? actU(a.a) : PCT,
        sg: a.k === 'SEC' && TK[a.o].cls === 'sig' ? TK[a.o].sg : -1,

/* returns number of cells consumed from the acting group */

    }
    case 'NET': {

    case 'KIL': {

function runCtx(S, e, P, tr, c, st, n, clone, ts, arr, dlt) {
  e.c = c; e.st = st; e.n = n; e.clone = clone; e.ts = ts; e.ro = c * SK.NREG; e.mark++;
  const rules = P.rules, idx = c * NS + st, kind = DIALECT[e.type].kind;
  let m = n;
  for (let q = 0; q < rules.length; q++) {
    const r = rules[q];
    if (!((r.mask >> st) & 1)) continue;
    if (r.guard && !r.guard(e)) continue;
    const ti = r.li * NC + c; tr.g[ti] += 1;
    const f = r.sto === null ? 1 : binFrac(S, m, clamp(r.sto(e), 0, 1));
    if (f <= 0) continue;
    const nAct = m * f; if (nAct < 1e-9) continue;

    let grp = nAct, halt = false;
    const fr = nAct / n;                                   // share of this context's population that executes the rule
    const acts = r.acts;
    for (let ai = 0; ai < acts.length; ai++) {
      const a = acts[ai];
      // physical set-value → internal drive (100 % ≡ 9); registers keep the raw real value
      const raw = a.arg ? a.arg(e) : 0, s = a.k === 'REG' ? raw : clamp(raw, 0, a.u.max) * a.u.d;
      switch (a.k) {

          const j = e.ro + a.o; let v = e.reg[j];
          if (a.op === 'SET') v = v * (1 - fr) + s * fr;
          else { const w = nAct / regDen(e, c, r.mask, n); if (a.op === 'INC') v += w * s; else v -= w * s; }
          e.reg[j] = clamp(v, -1e6, 1e6); break;

        case 'ST': if (arr && grp > 0 && a.o !== st) { dlt[idx] -= grp; dlt[c * NS + a.o] += grp; m -= grp; grp = 0; } break;
        case 'SEC': if (grp > 0) doSec(S, e, a, grp, s, fr); break;
        case 'MK': doMake(S, a.o, nAct, s); break;

          if (kind === 'body') { S.body[a.a] += fr * s; break; }
          if (kind === 'organ') { const it = e.og.it[st]; it[a.a] = (it[a.a] || 0) + fr * s; break; }
          const used = doAct(S, e, a.a, s, grp, dlt, idx, c, st);

}
/* register INC / DEC: the cells this context contributes, over all cells of the type in the compartment whose state the

function regDen(e, c, mask, n) {
  const T = e.ntot; if (!T) return n;
  let d = 0; for (let st = 0; st < NS; st++) if ((mask >> st) & 1) d += T[c * NS + st];
  return Math.max(n, d);
}

function applyDelta(a, d) { for (let i = 0; i < NC * NS; i++) { if (d[i] !== 0) { a[i] += d[i]; if (a[i] < 0) a[i] = 0; d[i] = 0; } } }

function runType(S, e, type) {
  const P = S.prog[type]; if (!P) return;
  const tr = S.trace[type]; tr.g.fill(0); tr.n.fill(0);
  tr.v = S.rec ? S.rec.vIdx[type] : -1; (S.traceRun || (S.traceRun = {}))[type] = tr;
  const D = DIALECT[type]; e.type = type; e.reg = S.reg[type]; e.og = null;
  const T = e.ntot || (e.ntot = new Float64Array(NC * NS)); T.fill(0);           // cells per compartment × state (register weighting)
  switch (D.kind) {
    case 'body': T[BLOOD * NS] = 1; runCtx(S, e, P, tr, BLOOD, 0, 1, null, null, null, null); break;
    case 'organ': {
      const O = S.og[type]; e.og = O;
      for (const st of D.states) if (O.n[st] > 0.01) T[BLOOD * NS + st] = O.n[st];
      for (const st of D.states) if (O.n[st] > 0.01) runCtx(S, e, P, tr, BLOOD, st, O.n[st], null, null, null, null);

function runPrograms(S) {
  S.cost = 0; S.costBrain = 0; S.hscDna = 0;
  const B = S.body; B.FEV = B.SHV = B.SWT = B.VCO = B.VDI = B.HRT = B.VNT = B.ADH = B.DRK = B.APP = B.RST = B.COF = B.VOM = B.SPL = 0; B.hor.fill(0);

/* ============================================================
   SOMA//KERNEL — sim C : physics
   ============================================================ */
const RADW = [.5, 1, .4, .2];
const MAINT = { NEU: 3e-6, MAC: 2e-5, DC: 2e-5, MAST: 1e-5, NK: 2e-5 };
const CLONE_CAP = 14;
const fitness = tr => Math.max(.2, 1 - .12 * (tr.ifa || 0) - .12 * (tr.mhd || 0) - .18 * (tr.cap || 0) - .08 * (tr.thm || 0) - .08 * (tr.ros || 0) - .1 * (tr.cmp || 0) - .08 * (tr.sup || 0) - .1 * (tr.intra || 0));

/* ---------------- tissues ---------------- */
function physTissue(S) {
  const rest = 1 + S.env.rest + 0.04 * Math.min(9, S.body.RST) * S.bodyEff;
  S.necH = 0;
  for (let t = 0; t < NT; t++) {
    const ts = S.tis[t], sg = S.comp[t].sig, it0 = ts.it[0], it1 = ts.it[1], H = ts.H;
    const g0 = k => Math.min(9, it0[k] || 0), g1 = k => Math.min(9, it1[k] || 0);
    ts.isg += (g0('ISG') / 9 - ts.isg) * 0.35;

    ts.mhcI += (0.3 + 0.7 * g1('PR1') / 9 - ts.mhcI) * 0.3;
    ts.muc += (g0('MUC') / 9 - ts.muc) * 0.4;

    if (t === BRAIN) cost += H * (g0('FIR') * 1e-4 + g0('INH') * 2e-5 + g0('HSP') * 4e-5 + g0('PLA') * 5e-5 + g0('AOX') * 2e-5);
    if (t === LIVER) cost += H * (g0('AOX') * 2e-5 + g0('DTX') * 6e-6);
    const edT = Math.min(1, sg[sHIS] * 0.03 + sg[sTNF] * 0.012 + (t === BRAIN ? ts.tum / (0.6 * ts.H0) : 0));
    ts.edema += (edT - ts.edema) * 0.2;

    const occ = (H + ts.Itot + ts.tum) / ts.H0;
    const space = clamp((1.1 - occ) / 0.1, 0, 1);
    const healF = 1 + 0.8 * Math.min(1, S.K.heal[t] / 1500);
    const born = H * g0('PRO') * T_PRO[t] * space * S.fuelF * healF * rest * (0.5 + 0.5 * Math.min(1, S.perf)) * (1 - 0.04 * S.hor[hCORT]);

    let nec = 0;
    const aox = (t === BRAIN ? 1 - 0.07 * g0('AOX') : t === LIVER ? 1.4 - 0.9 * S.gsh : 1);
    const rosK = H * sg[sROS] * 1.2e-4 * aox; nec += rosK; ts.kills.ros += rosK;
    const tnfK = H * Math.max(0, sg[sTNF] - 24) * 6e-5; nec += tnfK; ts.kills.imm += tnfK;

    }

    if (S.temp > 41) { const k = H * (S.temp - 41) * (t === BRAIN ? 0.012 : 0.004) * hsp; nec += k; ts.kills.heat += k; }

}

/* ---------------- pathogens ---------------- */

    abG: new Float64Array(NC), abM: new Float64Array(NC), repl: 0, gen: 0, born: S.t, tot: 0,
    kb: { ab: 0, ctl: 0, nk: 0, pha: 0, ros: 0, cmp: 0, isg: 0, muc: 0, fev: 0, fe: 0 }, chg: null

}
const strainTot = s => { let x = 0; for (let c = 0; c < NC; c++) x += s.load[c]; for (let t = 0; t < NT; t++) x += s.inf[t] * 3; return x; };
SK.strainTot = strainTot;

  const br = S.tis[BRAIN], n0 = br.it[0], ni = k => Math.min(9, n0[k] || 0), bsg = S.comp[BRAIN].sig;
  const act = ni('FIR') / 5, INH = ni('INH'), HSP = ni('HSP');
  const gluE = S.glu + 45 * Math.min(1, S.ket / 20);
  const fuelB = clamp((gluE - 28) / 30, 0, 1);
  const oxB = clamp((S.oxyBase * Math.min(1, S.bp / 58) * (1 - .35 * br.edema) - 36) / 34, 0, 1);
  const sup = Math.min(fuelB, oxB);
  if (act > sup * 1.3 + 0.05) S.glt += (act - sup * 1.3) * 0.5;
  if (S.temp > 40.2) S.glt += (S.temp - 40.2) * 0.4;

  const st = clamp(br.H / br.H0 * S.plas, 0, 1) * (1 - .4 * Math.min(1, br.tum / (0.5 * br.H0)));
  const af = act <= 1 ? act : 1 + (act - 1) * 0.25;
  const tmpB = S.temp > 40 ? 1 - clamp((S.temp - 40) / 2.2, 0, 1) : (S.temp < 34.5 ? 1 - clamp((34.5 - S.temp) / 5.5, 0, 1) : 1);
  const toxB = 1 / (1 + S.toxNeuro * 0.08 + Math.max(0, S.nh3 - 1.2) * 0.5);

  const phB = S.pH < 7.2 ? clamp(1 - (7.2 - S.pH) * 2.6, 0, 1) : (S.pH > 7.6 ? clamp(1 - (S.pH - 7.6) * 3, 0, 1) : 1);

  const ta = S.thd.t3A, thyB = (ta < 0.35 ? clamp(0.55 + 1.3 * ta, 0.55, 1) : 1) * (ta > 2.4 ? clamp(1 - 0.4 * (ta - 2.4), 0.5, 1) : 1);   // myxoedema stupor · thyrotoxic delirium

  S.sleepDebt = clamp(S.sleepDebt, 0, 1);

  S.bbb = clamp(0.04 + (1 - br.tj) * 0.25 + bsg[sTNF] / 40 + bl[sTNF] / 80 + (S.temp > 40 ? .15 : 0) + br.edema * .2, .04, 1);
  // modifiers for the next tick
  S.immMod = Math.max(.2, (1 - 0.045 * CORT * (1.15 - 0.15 * S.srn.dheaF)) * (1 + 0.06 * clamp(S.temp - 37, 0, 3)) * (S.temp < 35 ? .7 : 1) * (S.oxy < 70 ? .8 : 1) * (1 - 0.3 * S.sleepDebt) * (0.7 + 0.3 * S.atpF) * (0.85 + 0.15 * Math.min(1, S.thd.t3A)));   // ATP-poor leukocytes · T3-poor lymphopoiesis
  S.neuMod = S.glu > 180 ? .7 : 1;
  S.mastStab = 1 / (1 + 0.15 * ADR + 0.08 * CORT);

  S.sen = clamp((S.t - 3600) / 9600, 0, 1.5); S.age = S.sen;
  S.ageF = 0.35 + 0.65 * Math.min(1, S.t / 3600) + 1.5 * S.sen;           // somatic mutation load → cancer incidence (low in youth)
  S.thy = Math.max(.3, 1 - 0.5 * S.sen) * (1 - 0.05 * CORT * (1.15 - 0.15 * S.srn.dheaF));   // thymic involution (DHEA-S blunts the glucocorticoid share)

  S.bleed = 0;
}

/* ============================================================

SK.etco2 = etco2;
function senseMilieu(S, id) {
  switch (id) {
    case 'NA': return S.naM;

    case 'PH': return S.pH;

    case 'FFA': return S.ffa;

/* organ-program sensors: what a beta cell, a collecting-duct cell or a ventricular myocyte reads */
function senseOrgan(S, e, id) {
  const st = e.st, bl = S.comp[BLOOD].sig;
  if (e.type === 'ISL') {
    const I = S.isl;
    switch (id) {
      case 'ATP': return st === 1 ? I.aAtp : st === 2 ? I.dAtp : I.atp;                       // ATP:ADP ratio
      case 'KAT': return 100 * (st === 1 ? I.aKatp : st === 2 ? I.dKatp : I.katp);           // K-ATP open probability %
      case 'CA': return 100 + 500 * Math.min(1, st === 1 ? I.aCa : st === 2 ? I.dCa : I.ca); // cytosolic Ca2+ nmol/L
      case 'CMP': return I.camp;                                                             // cAMP µmol/L
      case 'ACH': return 20 * I.ach;
      case 'INS': return S.insP;                                                             // intra-islet ≈ portal insulin
      case 'GCG': return S.gcgP;
      case 'RRP': return 100 * (st === 1 ? I.aRrp : st === 2 ? I.dRrp : I.rrp);              // docked granules per cell
      case 'RES': return 500 * (st === 1 ? I.aRes : st === 2 ? I.dRes : I.res);              // reserve granules per cell
      case 'PRI': return 100 * (st === 1 ? I.aPri / 2 : st === 2 ? I.dPri : I.erLoad);       // ER client load % of capacity
      case 'ERS': return clamp(I.ers / 9 * 100 * (st === 1 ? 0.4 : st === 2 ? 0.6 : 1), 0, 100);   // IRE1/PERK activation %
      case 'ROS': return 10 * I.ros;
      case 'TNF': return (bl[sTNF] + 25 * I.inf) * SIG_U[sTNF];
      case 'IFNG': return (bl[sIFNG] + 15 * I.inf) * SIG_U[sIFNG];
      case 'VRNA': return st === 0 ? Math.log10(1 + I.vir * 1e7) : 0;
      case 'DMG': return 100 * clamp(1 - (st === 1 ? I.am : st === 2 ? I.dm : I.bm), 0, 1);
      case 'DENS': return 100 * (st === 1 ? I.am : st === 2 ? I.dm : I.bm);
    }
    return undefined;
  }
  if (e.type === 'NEP') {
    const kd = S.kid;
    switch (id) {
      case 'O2': return ptO2(S.oxy * (st === 2 || st === 3 ? 0.78 : 1) * (1 - 0.4 * kd.aki));   // the medulla runs hypoxic
      case 'DMG': return 100 * clamp(kd.aki * (st === 1 ? 1.15 : st === 4 ? 0.5 : st === 0 ? 0.7 : 0.9), 0, 1);
      case 'DENS': return 100 * kd.nm;
      case 'TOX': return (S.toxc[BLOOD] + kd.ntx * 3) * 0.5;
    }
    return undefined;
  }
  if (e.type === 'ALV') {
    const A = S.alv, sx = SIGX[id];
    if (sx !== undefined) return S.comp[LUNG].sig[sx] * SIG_U[sx];                           // alveolar cells live in the lung compartment
    switch (id) {
      case 'O2': return st === 2 ? A.ps : st === 3 ? A.pAO2 * 0.9 + 0.1 * A.pvo2 : A.pAO2 * (1 - 0.6 * A.afl);   // pneumocytes: alveolar gas · arteriole: HPV stimulus PO₂
      case 'ACH': return 20 * S.cv.vag + 25 * A.irr;                                         // vagal tone + irritant-receptor reflex (smoke, particles)
      case 'TOX': return S.toxc[LUNG] * 0.5;
      case 'PAMP': return S.pamp[LUNG] * 0.1;
      case 'VRNA': return st <= 1 ? Math.log10(1 + S.tis[LUNG].Itot * (st === 1 ? 2800 : 1600)) : 0;
      case 'DMG': return 100 * clamp(st === 0 ? 1 - A.at1 + 6 * A.inj1 : st === 1 ? 0.75 * (1 - A.at1) + 0.25 * Math.max(0, 1 - A.at2) + 4 * A.inj2 : st === 2 ? 1 - A.endo + 6 * A.injE : 0, 0, 1);
      case 'DENS': return 100 * (st === 0 ? A.at1 : st === 1 ? A.at2 : st === 2 ? A.endo : A.asm);
    }
    return undefined;
  }
  if (e.type === 'SRN') {
    const R = S.srn;
    switch (id) {
      case 'CORT': return st === 3 ? R.medC : R.cortT;                                        // the medulla is bathed in cortical effluent
      case 'ACH': return R.ach;                                                              // splanchnic preganglionic acetylcholine
      case 'GRN': return 100 * R.grn;                                                        // chromaffin granule store
      case 'O2': return ptO2(S.oxy) * (st === 3 ? 0.8 : st === 2 ? 0.86 : st === 1 ? 0.93 : 1);   // centripetal sinusoids: inner zones get spent blood
      case 'DMG': return 100 * clamp(st === 0 ? 1 - Math.min(1, R.zg) + 6 * R.injG : st === 1 ? 1 - Math.min(1, R.zf) + 6 * R.injF : st === 2 ? 1 - Math.min(1, R.zr) + 6 * R.injR : 1 - Math.min(1, R.med) + 6 * R.injM, 0, 1);
      case 'DENS': return 100 * (st === 0 ? R.zg : st === 1 ? R.zf : st === 2 ? R.zr : R.med);
    }
    return undefined;
  }
  if (e.type === 'LOB') {
    const L = S.lob, liv = S.tis[LIVER];
    switch (id) {
      case 'O2': return st === 0 ? L.pz1 : st === 1 ? L.pz3 : st === 2 ? 0.5 * (L.pz1 + L.pz3) : S.pao2 * 0.55 * clamp(L.qa / QA0, 0.15, 1.6);   // zone 1 · zone 3 · sinusoid · peribiliary plexus
      case 'DMG': return 100 * clamp(st === 0 ? 1 - L.z1 : st === 1 ? 1 - L.z3 : st === 2 ? Math.max(1 - liv.H / liv.H0, 25 * L.hPrevD) : 1 - L.cho, 0, 1);
      case 'DENS': return 100 * (st === 0 ? L.z1 : st === 1 ? L.z3 : st === 2 ? L.kup : L.cho);
      case 'PAMP': return st === 2 ? 0.1 * (S.pamp[GUT] * (1 - 0.7 * L.sh) + S.pamp[BLOOD]) : S.pamp[BLOOD] * 0.1;   // Kupffer cells see portal blood
      case 'DAMP': return S.comp[LIVER].sig[sDAMP] * SIG_U[sDAMP];
      case 'ROS': return S.comp[LIVER].sig[sROS] * SIG_U[sROS];
      case 'TNF': return st >= 2 ? S.comp[LIVER].sig[sTNF] * SIG_U[sTNF] : undefined;
    }
    return undefined;
  }
  if (e.type === 'SPN') {
    const P = S.spn, a = 1 - P.inf;
    switch (id) {
      case 'O2': return ptO2(S.oxy) * clamp(P.spF, 0.3, 1);
      case 'DMG': return 100 * clamp(st === 0 ? Math.max(1 - P.rp, P.hemeL) : st === 1 ? 1 - P.mz : st === 2 ? 1 - P.mzm : P.inf, 0, 1);
      case 'DENS': return 100 * (st === 0 ? P.rp * a : st === 1 ? P.mz * a : st === 2 ? P.mzm * a : P.sm);
    }
    return undefined;
  }
  if (e.type === 'THY') {
    const Y = S.thd;
    switch (id) {
      case 'CMP': return Y.camp;                                                             // thyrocyte cAMP (TSH-receptor signalling)
      case 'GRN': return 100 * (st === 1 ? Y.pS : st === 2 ? Y.cS : clamp(Y.colI / COL0, 0, 2));   // PTH · calcitonin granules · colloid iodine
      case 'ROS': return st === 0 ? 4 * Y.ox : S.comp[BLOOD].sig[sROS] * SIG_U[sROS];        // the thyrocyte's own H₂O₂ load
      case 'O2': return ptO2(S.oxy) * (st === 3 ? 0.9 : 1);
      case 'VRNA': return st === 0 ? Math.log10(1 + Y.vir * 1e7) : 0;
      case 'DMG': return 100 * clamp(st === 0 ? Math.max(1 - Math.min(1, Y.fol), 25 * Y.inj0) : st === 1 ? 1 - Math.min(1, Y.chief) : st === 2 ? 1 - Math.min(1, Y.cc) : 1 - Y.d1, 0, 1);
      case 'DENS': return 100 * (st === 0 ? Y.fol : st === 1 ? Y.chief : st === 2 ? Y.cc : Y.dioC);
    }
    return undefined;
  }
  if (e.type === 'CAR') {
    const cv = S.cv;
    switch (id) {
      case 'CA': return 1000 * cv.caT;                                                       // systolic Ca2+ transient nmol/L
      case 'O2': return 25 * cv.o2b;                                                         // myocardial PO2-equivalent mmHg
      case 'ATP': return Math.max(0.5, 8 * Math.min(1.6, cv.o2b) * (1 - cv.dmg));            // PCr/ATP-like energy ratio
      case 'DMG': return 100 * Math.min(1, cv.dmg + 0.5 * cv.myo);
      case 'DENS': return 100 * (1 - cv.dmg);
    }
    return undefined;
  }
  return undefined;
}

/* ---------- program drives (acts summed over rules, read once per hour) ---------- */
function drives(S, type) {
  const it = S.og[type].it;
  return (st, k) => Math.min(9, it[st][k] || 0);
}

/* ============================================================

function isletSub(S, G, g) {
  const I = S.isl, adr = S.hor[hADR], sst = I.sstL;

/* ============================================================
   SPLEEN — red pulp, marginal zone, capsule (SPN)
   · red-pulp macrophages: culling of senescent and rigid red cells in the cords of Billroth; haem oxygenase-1

   · capsule and trabecular smooth muscle: α-adrenergic contraction releases the platelet reservoir

   hyposplenism (pocked red cells) and overwhelming sepsis with encapsulated bacteria

function initSpleen(S) {
  S.spn = { rp: 1, mz: 1, mzm: 1, sm: 1, size: 1, sizeE: 1, inf: 0, pool: 125, heme: 0, hemeL: 0, rgd: 0.0004,
    cull: 0.002, shS: 0.55, feIn: 0.002, bilOut: 9.4, filt: 1, igmD: 0, igm: 0, cps: 0, pocked: 0.9, ctrF: 0, spF: 1, infT: -999, infE: 0 };

function physSpleen(S, Bc) {

  const PH0 = g(0, 'PHA'), HOX = g(0, 'HOX'), PR0 = g(0, 'PRO'), AP0 = g(0, 'APO'), AO0 = g(0, 'AOX');
  const PR1 = g(1, 'PRO'), AP1 = g(1, 'APO'), PH2 = g(2, 'PHA'), PR2 = g(2, 'PRO'), CTR = g(3, 'CTR');

  const hyp = clamp(S.pamp[BLOOD] * 0.01 + ifg / 40 + il6 / 300, 0, 1.2);

  kd.nac = clamp(dCD * (1 - 0.15 * (NKC - 5)) / 0.19 * (kd.gfr / 118) * (S.na / 140) * Math.exp(5 * (veff - 1)), 0, 2);   // macula densa NaCl
  // ---- whole-body water / Na+ / K+ / base balance
  const insens = 30 * (1 + 0.12 * Math.max(0, S.temp - 37)) * (1 + 0.05 * S.vnt) * (1 - 0.3 * env.hum);
  const diar = S.diar * ECF0 * 1000, bleed = S.bleed * ECF0 * 1000, sweat = S.sweatML;
  const drink = 50 * Bc.DRK * (1 - 0.92 * env.dry);

  const vomL = 0.12 * (S.vomit || 0);                                                     // L of gastric fluid per hour
  L.W = clamp(L.W + (drink + S.mealW + 15 - kd.uo - insens - sweat - diar - bleed) / 1000 - vomL, 22, 60);
  kd.swNa = clamp(60 / (1 + 0.12 * kd.ald) * (1 - 0.4 * (S.hac || 0)), 8, 60);                                      // aldosterone acts on eccrine ducts: heat acclimatisation
  L.NaE = clamp(L.NaE + S.mealNa - kd.naU - sweat * kd.swNa / 1000 - diar * 0.1 - bleed * 0.14 - vomL * 60, 900, 3200);
  L.KE = clamp(L.KE + S.mealK - kd.kU - sweat * 0.005 - diar * 0.03 - bleed * 0.004 + S.kRel - vomL * 12, 1800, 4600);
  L.hco3b = clamp(L.hco3b + (kd.nae - 2.9 * metab - waste - bicarbU - diar * 0.04 + vomL * 90) / (ECF0 * Math.max(0.4, S.vol)), 4, 45);   // lost HCl leaves HCO3- behind
  S.vol = clamp(L.W * L.NaE / (L.NaE + OSMI) / ECF0, 0.3, 1.6);
  // plasma volume (≈3 L): whole-blood loss empties it at once; Starling refill from the interstitium follows (τ ≈ 4 h)
  // and a capillary leak holds part of it out. Blood volume = plasma + red cells; Hb concentration = red cell mass / BV
  S.pvF += (Math.max(0.15, S.vol - S.lob.asc / ECF0) * (1 - S.leak) * (1 + 0.5 * Math.max(0, 1 - S.rbc)) * (1 - 0.3 * clamp((3.6 - S.lob.alb) / 3.6, 0, 0.6)) - S.pvF) * 0.22;   // chronic anaemia expands plasma; ascites and a low oncotic pressure shrink it
  S.pvF = Math.max(0.15, S.pvF);
  S.bvF = (3.0 * S.pvF + 2.0 * S.rbc) / 5.0;

  S.na = (L.NaE + OSMI) / L.W;

}

/* ============================================================
   GLUCOSE ↔ HORMONES, six 10-minute substeps per hour
   ============================================================ */
function physGlucose(S, Bc, metab, ab) {
  const I = S.isl, g = drives(S, 'ISL'), bl = S.comp[BLOOD].sig;
  const liv = S.tis[LIVER], Lf = clamp(liv.H / liv.H0, 0, 1) * (1 - .5 * Math.min(1, liv.tum / (0.8 * liv.H0)));
  S.glyCap = 65 * Math.max(.05, Lf);                                                        // ≈ 115 g of liver glycogen
  const h0 = liv.it[0], gi = k => Math.min(9, h0[k] || 0);
  const GLS = gi('GLS'), GLR = gi('GLR'), GNG = gi('GNG'), LIP = gi('LIP'), KGN = gi('KGN');
  const CORT = S.hor[hCORT], ADR = S.hor[hADR];
  // insulin sensitivity of muscle / fat: glucocorticoids, catecholamines, inflammatory cytokines, contraction (GLUT4)
  S.isens = clamp((1 - 0.05 * CORT) * (1 - 0.035 * ADR) * (1 - 0.35 * Math.min(1, (bl[sTNF] + 0.5 * bl[sIL6]) / 50)) * (1 + 0.6 * S.exer) * (1 - 0.012 * S.env.sugar), 0.25, 1.8);
  I.ach = clamp(0.25 + 0.35 * Math.min(1, S.lum / 15) - 0.025 * Bc.HRT, 0, 1);              // vagal / cephalic phase
  I.aa = clamp(S.lum / 40, 0, 1);                                                          // amino acids
  const gut = S.tis[GUT];
  S.glp1 = 2.5 + 2.4 * Math.min(9, S.body.hor[hGLP]) * clamp(gut.H / gut.H0, 0, 1);        // L cells; DPP-4 t½ ≈ 2 min
  // fuel use (energy units / hour) — fatty acids and ketones spare glucose
  const other = 5.3 * metab + 2.0 * Bc.SHV + 0.12 * Bc.HRT + 0.06 * S.vnt + 0.03 * ADR + S.exerE;
  let cons = S.cost + other; if (S.oxy < 80) cons *= 1 + (80 - S.oxy) / 120;
  const bc = Math.min(cons, S.costBrain), nb = cons - bc;
  // starvation adaptation (days): lipolysis, hepatic ketogenesis and brain ketone transport rise while no food arrives
  S.fast = clamp((S.fast || 0) + (ab > 3 ? -0.15 * (S.fast || 0) : (1 - (S.fast || 0)) / 54), 0, 1);
  const mobH = clamp((0.9 * (S.hor[hGCG] + ADR + 0.5 * CORT) - 0.8 * S.hor[hINS] + 3.5 * S.fast) * (0.8 + 0.2 * clamp(S.thd.t3A, 0.3, 2)), 0, 20);     // hormone-sensitive lipase (stress lipolysis can exceed basal needs)
  const mob = mobH + 30 * S.exer;                                                          // working muscle also burns intramuscular TG
  S.ffa = clamp(0.2 + 0.12 * mobH + 0.6 * S.exer, 0.05, 2.5);
  const ku = Math.min(bc * (0.15 + 0.45 * S.fast), S.ket * 0.25), kuP = Math.min(nb * 0.3, S.ket * (0.4 - 0.3 * S.fast));   // ketones: brain (≤60 % once adapted), muscle (avid early in a fast)
  const ffaU = Math.min(Math.max(0, nb * 0.8 - kuP), mob, S.fat);
  const mUseH = (S.exerE + 2.0 * Bc.SHV) * 0.45 * clamp(S.mgly / 120, 0.25, 1);   // shivering costs what it heats (≈ +20 kcal/h per level)                                          // working muscle burns its own glycogen
  // muscle lacks G6Pase: its glycogen reaches the brain only as lactate / alanine → hepatic gluconeogenesis
  // (Cori and glucose–alanine cycles), switched on by adrenaline (β2 → phosphorylase) and by hypoglycaemia
  const coriH = Lf * 2.4 * Math.min(2, ADR / 4) * clamp((110 - S.glu) / 40, 0, 1); S.coriH = 0;   // β2-adrenergic muscle glycogenolysis → lactate → liver
  let Jsum = 0, aSum = 0, dSum = 0, secSum = 0, rASum = 0, rDSum = 0, gluU = 0; S.rdH = 0;
  const EB = S.eb; if (EB) { EB.n++; EB.abs += ab; EB.cons += cons; EB.prog += S.cost; }
  for (let k = 0; k < SUB; k++) {
    secSum += isletSub(S, Math.max(1, S.glu), g); Jsum += I.J; aSum += I.aCa; dSum += I.dCa; rASum += I._rA; rDSum += I._rD;
    S.glu += ab * DT / GE;
    let f;
    f = Math.min(Lf * GLS * 0.55, Math.max(0, (S.glu - 60) * GE * 0.3), Math.max(0, S.glyCap - S.gly) / 0.95) * DT; S.glu -= f / GE; S.gly += f * 0.95; if (EB) EB.gls += f * 0.05;
    f = Math.min(Lf * GLR * 0.9 * DT, S.gly); S.gly -= f; S.glu += f / GE;
    f = Math.min(Lf * GNG * 0.65 * DT * (0.3 + 0.7 * S.srn.gcP) * (0.75 + 0.25 * clamp(S.thd.t3A, 0.3, 1.6)), Math.max(0, S.fat)); S.fat -= f; S.glu += f * 0.75 / GE; if (EB) EB.gng += f * 0.25;
    f = Math.min(Lf * LIP * 0.8, Math.max(0, (S.glu - 80) * GE * 0.3)) * DT; S.glu -= f / GE; S.fat += f * 0.88; if (EB) EB.lip += f * 0.12;
    f = Math.min(Lf * (KGN * (0.25 + 0.06 * mobH) + 0.25 * S.ffa * (1 + 2 * S.fast) * (1 - 0.6 * Math.min(1, S.ins / 30))) * DT, Math.max(0, S.fat)); S.fat -= f; S.ket += f * 0.85; if (EB) EB.kgn += f * 0.15;   // FFA flux feeds ketogenesis (basal β-oxidation + programmed)
    if (S.gly > S.glyCap) { S.glu += (S.gly - S.glyCap) / GE * .5; if (EB) EB.over += (S.gly - S.glyCap) * 0.5; S.gly = S.glyCap; }
    // GLUT4 uptake follows remote insulin action (≈ 25 min lag) into muscle glycogen, then adipose
    S.insX += (S.ins / 8 - S.insX) * (1 - Math.exp(-2.4 * DT));

    const toM = Math.min(rd * 0.6, Math.max(0, MGCAP - S.mgly)); S.mgly += toM; S.fat += (rd - toM) * 0.9; S.glu -= rd / GE; if (EB) EB.rdf += (rd - toM) * 0.1;
    const mU = Math.min(S.mgly, mUseH * DT); S.mgly -= mU;
    const cori = Math.min(S.mgly, coriH * DT); S.mgly -= cori; S.glu += cori * 0.8 / GE; S.coriH += cori; if (EB) EB.cori += cori * 0.2;
    const fu = Math.min(ffaU * DT, Math.max(0, S.fat)); S.fat -= fu;                       // fatty acids only while adipose stores last
    const kU = Math.min((ku + kuP) * DT, S.ket); S.ket -= kU;
    S.glu -= (cons * DT - fu - kU - mU) / GE;
    // renal glucose: filtered load beyond SGLT2 capacity spills (with splay)
    const filt = S.kid.gfr * Math.max(0, S.glu) / 100 * 60 * DT, tm = S.kid.tm * DT;
    let exc = filt;
    if (tm > 1) { const w = 0.04 * tm, x = (filt - 0.9 * tm) / w; exc = Math.min(filt, x > 30 ? filt - 0.9 * tm : w * Math.log1p(Math.exp(x))); }   // threshold ≈ 180–200 mg/dL, narrow splay
    S.glu -= exc / GDV * GLY_E; gluU += exc; if (EB) EB.glyU += exc / GDV * GLY_E * GE;
    if (S.glu < 0) { if (EB) EB.neg -= S.glu * GE; S.glu = 0; }
  }
  if (EB) { EB.ket += S.ket * 0.02; EB.fcap += Math.max(0, S.fat - 40000); }
  S.ket *= 0.98;
  S.kid.gluU = gluU / 1000;                                                                // g/h
  I.secB = secSum / SUB; I.secA = rASum / SUB; I.secD = rDSum / SUB;
  isletTick(S, g, Jsum / SUB, aSum / SUB, dSum / SUB);
  S.costLast = cons; S.fat = Math.min(S.fat, 40000);
}

/* ============================================================
   MILIEU — lactate, pCO2, HCO3-, pH, K+ shifts, Na+, osmolality; hormone levels cells read
   ============================================================ */
function physMilieu(S, Bc, metab) {
  const L = S.lyte, kd = S.kid, bl = S.comp[BLOOD].sig, lung = S.tis[LUNG], liv = S.tis[LIVER];
  const Lf = clamp(liv.H / liv.H0, 0, 1);
  const hyp = clamp((78 - S.oxy) / 40, 0, 1.5);
  const prod = 0.9 * metab + 6 * hyp * hyp + 3 * Math.max(0, 0.8 - S.cv.co / 5.2) + 2.2 * Math.min(1, bl[sTNF] / 60) + 2.4 * S.exer + 0.04 * Bc.SHV + 0.4 * Math.max(0, S.glt - 1) + 0.05 * (S.coriH || 0) + 10 * S.alv.o2debt;   // O₂ demand above the extraction ceiling
  S.lac = clamp(S.lac + prod - S.lac * 0.9 * (0.15 + 0.85 * Lf) * Math.min(1, S.perf + 0.1), 0.3, 25);   // Cori cycle clearance
  const vco2 = metab * (1 + 0.03 * Bc.SHV) + S.exerE / 11;
  // ventilation: the neural drive demands a minute volume (only a weak involuntary floor — the body program runs the chemoreflex;
  // J-receptors add a little with interstitial oedema); the pump delivers what mechanics and a fatigued, ATP-poor diaphragm allow
  const A = S.alv;
  const want = 6 * (1 + 0.07 * S.vnt) / (1 + 0.07 * VNT_REF) * (1 + 4.2 * S.exer) * (1 + 0.008 * Math.max(0, S.pco2 - 45)) * (1 + 0.2 * A.jrec) * S.thd.ventT;
  S.ve = want / Math.pow(1 + Math.pow(want / Math.max(1, A.veMax), 4), 0.25) * (0.6 + 0.4 * S.atpF);
  // the pattern minimises work: stiff lungs → rapid and shallow, obstruction → slow and deep; fatigue and J-receptors quicken it
  S.rr = clamp(14 * Math.pow(S.ve / 6, 0.55) * Math.pow(100 / Math.max(5, A.comp), 0.35) * Math.pow(2 / A.raw, 0.1) * (1 + 0.5 * A.fat) * (1 + 0.25 * A.jrec), 4, 50);
  S.vt = 1000 * S.ve / S.rr;
  // dead space: anatomic ≈150 mL (a little more with bronchomotor tone) + alveolar → alveolar ventilation → PaCO₂
  A.vdvt = clamp((150 * (1 + 0.25 * A.tone) + A.vdA * Math.max(0, S.vt - 150)) / Math.max(60, S.vt), 0.2, 0.95);
  const va = S.ve * (1 - A.vdvt) / 3.87;                                                       // × resting alveolar ventilation
  S.pco2 = clamp(40 * vco2 / Math.max(0.05, va), 12, 110);
  S.ketM = S.ket * 0.36;
  { const il6 = S.comp[BLOOD].sig[sIL6] * SIG_U[sIL6], Lf = clamp(S.tis[LIVER].H / S.tis[LIVER].H0, 0, 1);   // CRP: hepatic acute-phase synthesis, t½ ≈ 19 h
    S.crp = Math.max(0, (S.crp || 0.8) + 0.245 * Math.pow(Math.max(0, il6 - 4), 0.9) * Lf + 0.03 - 0.036 * (S.crp || 0.8)); }                                                                   // β-hydroxybutyrate, mmol/L
  S.hco3 = clamp(L.hco3b - Math.max(0, S.lac - 1) - Math.max(0, S.ketM - 0.3), 2, 45);     // anion-gap acids consume HCO3-
  S.pH = 6.1 + Math.log10(S.hco3 / (0.03 * S.pco2));
  const dKE = L.KE - KE0;                                                                  // deficits are buffered by the intracellular pool (≈ −1 mmol/L per 300 mmol), excess is not
  S.k = clamp(4.2 + (dKE > 0 ? dKE / 150 : dKE / 300) + 3.5 * (7.40 - S.pH) - 0.15 * (Math.log2(1 + S.ins / 10) - 0.766)
    - 0.06 * Math.max(0, S.hor[hADR] - 1) + 0.04 * Math.max(0, S.osm - 300) - S.kShift, 1.5, 9.5);
  S.naM = S.na - 1.6 * Math.max(0, S.glu - 100) / 100;                                     // translocational
  S.osm = 2 * S.naM + S.glu / 18 + kd.bun / 2.8;
  S.kRel = 0; S.pig *= 0.9;
  // hormone levels on the 0–9 scales every dialect reads
  S.hor[hINS] = clamp(S.ins / 8, 0, 9);
  S.hor[hGCG] = clamp((S.gcg - 30) / 20, 0, 9);
  S.hor[hEPO] = clamp(Math.log2(Math.max(1, kd.epo / 10)) * 2.2, 0, 9);
  S.hor[hAVP] = clamp(kd.avp * 0.9, 0, 9);
  S.hor[hALD] = clamp(kd.ald / 4, 0, 9);
  S.hor[hANG] = clamp(kd.ang / 8, 0, 9);
  S.hor[hREN] = clamp(kd.ren * 1.5, 0, 9);
  S.hor[hANP] = clamp(S.cv.anp / 25, 0, 9);
  S.hor[hGLP] = clamp(S.glp1 / 3, 0, 9);
  S.hor[hSST] = clamp(S.isl.sstL * 5, 0, 9);
  S.hor[hPTH] = clamp(S.pth / 10, 0, 9);
  S.hor[hHPC] = clamp(S.hepc / 8, 0, 9);
}

/* enterovirus load in blood (islet and myocardial tropism) */

}

/* paraneoplastic secretion: rolled once per primary tumour, inherited by subclones and metastases */

const ECTO_K = { avp: 0.0025, pthrp: 0.006, igf2: 0.0016, acth: 0.003, cal: 0.03, epo: 0.03 };   // per tumour cell unit

/* ---------------- calcium · phosphate · magnesium ---------------- */
function physMinerals(S, Bc) {
  const kd = S.kid, bl = S.comp[BLOOD].sig, gut = S.tis[GUT], env = S.env;
  const il6 = bl[sIL6] * SIG_U[sIL6], V = ECF0 * clamp(S.vol, 0.5, 1.5), gfrL = kd.gfr * 0.06;
  const g = drives(S, 'NEP'), NPT = g(1, 'NPT'), NKC = g(2, 'NKC');
  const mgD = S.mgM * MG_MG;
  // ---- parathyroid hormone is the chief cells' output (thyroid program, set in physThyroid); PTH-related peptide from tumours
  S.pthrp = 0.4 + S.ecto.pthrp;
  const resist = (1 - 0.3 * Math.min(1, il6 / 200)) * clamp(0.35 + 0.65 * mgD / 1.2, 0.5, 1);   // sepsis and hypomagnesaemia blunt the target organs
  const pthE = (S.pth + 10 * S.pthrp) / 26 * resist, pS = 2 * pthE / (1 + pthE);           // 1 at normal, saturating at 2
  // ---- calcitriol: renal 1α-hydroxylase (PTH and low phosphate up; nephron loss and inflammation down) + lymphoma
  const vdT = (12 + 28 * pS * (1.4 - 0.4 * Math.min(1.75, S.pM / 1.13))) * kd.nm * (1 - 0.5 * kd.aki) * (1 - 0.3 * Math.min(1, il6 / 200)) + S.ecto.cal;

  const pc = Math.min(1, S.fast * 4) * (1 - 0.6 * S.fast);                                  // protein catabolism of a fast (peaks day 2–3)
  const stress = 0.15 * (Math.min(9, Math.max(0, S.hor[hCORT])) / 9 + Math.max(0, S.temp - 37.5) / 2);
  const acid = Math.max(0, 7.32 - S.pH) / 0.05, alk = Math.max(0, S.pH - 7.45) / 0.05;
  const Cr = 1.1 * pc + stress, Ar = 0.12 * acid, Rr = 0.3 * Math.max(0, -S.pDef);
  const insA = Math.max(0, S.insX - 0.6), dF = Math.max(0, S.pDef) / (Math.max(0, S.pDef) + 25);

  // ---- kidney: Ca²⁺ (TAL paracellular via NKCC2, distal TRPV5 under PTH, CaSR), phosphate (NaPi-II Tm under PTH), Mg²⁺ (TAL)
  const feCa = clamp(0.015 * Math.exp(-0.9 * (pS - 1) - 0.12 * (NKC - 5) + 4 * (S.caM / S.lob.albF - 2.35)) * (1 + 2.5 * Math.max(0, S.vol - 1)) * (1 + 1.5 * Math.max(0, 7.36 - S.pH) / 0.1) * (1 + 0.4 * S.thd.ctEff), 0.001, 0.4);
  const caU = gfrL * 0.6 * S.caM * feCa;
  const tmp = (0.55 + 0.12 * NPT) / Math.pow(Math.max(0.15, pS), 0.6), x = (S.pM - tmp) / 0.12;
  const pU = gfrL * (0.03 * S.pM + 0.12 * (x > 30 ? x : Math.log1p(Math.exp(x))));
  const feMg = clamp(0.038 * Math.exp(-0.25 * (NKC - 5) + 5 * (S.mgM - 0.86)) * (1 + 2 * Math.max(0, S.ica - 1.35)) * (1 + 0.3 * kd.gluU), 0.003, 0.6);
  const mgU = gfrL * 0.7 * S.mgM * feMg;
  const diarL = S.diar * ECF0, mgGI = diarL * 4 + 0.12 * (S.vomit || 0) * 0.5;               // secretory diarrhoea carries ≈ 4 mmol/L Mg²⁺
  // ---- bone: the exchangeable pool pulls Ca toward a PTH-set equilibrium; immobility and acidaemia resorb
  const immob = 0.15 * Math.max(env.rest, Math.min(1, Bc.RST / 9));
  const caEq = 1.75 + 0.6 * pS + immob + 0.12 * Math.max(0, 7.35 - S.pH) / 0.1 - 0.3 * S.thd.ctEff + 0.12 * Math.max(0, S.thd.t3A - 1);   // calcitonin stills osteoclasts · T3 speeds turnover
  const boneCa = 0.15 * (caEq * S.lob.albF - S.caM) * V, boneP = 0.6 * boneCa;   // bone and kidney defend ionised Ca: with less albumin, less total Ca
  // ---- Ca × P beyond solubility: metastatic calcification (and nephrocalcinosis)
  const cap = S.caM * CA_MG * S.pM * P_MG;

  const prCa = Math.min(0.3 * S.caM * V, 0.02 * S.capX * V), prP = prCa * 0.67;
  // ---- update
  S.caM = clamp(S.caM + (aCa + boneCa - caU - prCa) / V, 0.9, 4.5);
  S.pM = clamp(S.pM + (aP + boneP + Cr + Ar + Rr + S.relP - U - pU - prP) / V, 0.08, 7);
  S.mgM = clamp(S.mgM + (aMg + 0.15 * (Cr + Ar + Rr) - 0.2 * U - mgU - mgGI) / (2.5 * V), 0.15, 4);
  S.relP = 0;
  S.ica = S.caM * (0.92 - 0.4 * S.lob.alb / 4.2) * (1 - 0.4 * (S.pH - 7.4)) * (1 - 0.06 * Math.max(0, S.pM - 1.6));   // ≈ 40 % of total Ca rides on albumin
  kd.caU = caU; kd.pU = pU; kd.mgU = mgU;
  // ---- consequences: ATP depletion (phosphate), neuromuscular excitability (Ca, Mg), nephrogenic DI (Ca)
  S.atpF = clamp((S.pM - 0.15) / 0.45, 0.25, 1);
  if (S.atpF < 0.75) S.hemoX += 0.004 * (0.75 - S.atpF);                                     // ATP-poor red cells lyse
  if (S.atpF < 0.55) { const r = 0.55 - S.atpF; S.kRel += 6 * r; S.pig += 0.1 * r; S.relCK += 6000 * r; }   // hypophosphataemic rhabdomyolysis
  S.caDI = clamp((S.ica - 1.4) / 0.6, 0, 1);
  const caB = S.ica < 0.9 ? clamp(1 - (0.9 - S.ica) / 0.8, 0.2, 1) : S.ica > 1.55 ? clamp(1 - (S.ica - 1.55) / 0.8, 0.2, 1) : 1;
  const mgB = mgD < 1.1 ? clamp(1 - (1.1 - mgD) / 0.8, 0.3, 1) : mgD > 6 ? clamp(1 - (mgD - 6) / 8, 0.3, 1) : 1;
  const pB = S.atpF < 0.6 ? clamp(0.4 + (S.atpF - 0.25) / 0.35 * 0.6, 0.4, 1) : 1;
  S.bf.ca = caB; S.bf.mg = mgB; S.bf.p = pB;
  if (S.ica < 0.8 || mgD < 0.8) S.glt += 0.25 * (Math.max(0, 0.8 - S.ica) / 0.2 + Math.max(0, 0.8 - mgD) / 0.4);   // tetany → seizures
  if (!S.flags.refeed && S.pM < 0.5 && S.pDef > 15) { S.flags.refeed = 1; ev(S, 'refeed', { p: S.pM * P_MG }); } else if (S.flags.refeed && S.pM > 0.8) S.flags.refeed = 0;
}

/* ---------------- purines · cell lysis markers ---------------- */
function physUrate(S) {
  const kd = S.kid, liv = S.tis[LIVER], Lf = clamp(liv.H / liv.H0, 0, 1), XO = Math.min(9, liv.it[0].XO || 0);
  const xoF = (0.12 + 0.88 * Math.min(1.4, XO / 5)) * (0.4 + 0.6 * Lf);
  const hyp = clamp((80 - S.oxy) / 40, 0, 1);
  S.comp[LIVER].sec[sROS] += 0.03 * XO * (1 + 3 * hyp);                                     // XO superoxide, worst on reperfusion
  const prod = (38 + S.relUA) * xoF;                                                       // mg/h; purines from dead cells need XO too
  const fe = clamp(0.08 * (1 + 4 * Math.max(0, S.vol - 1)) * (1 - 1.7 * Math.max(0, 1 - S.vol)) * (1 - 0.35 * Math.min(1, S.ketM / 3)) * (1 - 0.25 * Math.min(1, S.lac / 6)) * (1 - 0.1 * Math.min(2, S.insX / 3)), 0.02, 0.25);
  const ren = kd.gfr * 0.06 * S.ua * 10 * fe, gutU = 9 * S.ua / 5;
  S.ua = clamp(S.ua + (prod - ren - gutU) / 200, 0.3, 40);
  S.relUA = 0;
  // supersaturated urate: tubular crystals when urine is scant and acid; tissue crystals are a DAMP (NLRP3)
  S.uaHit = Math.max(0, S.ua - 12) * Math.sqrt(70 / Math.max(15, kd.uo)) * (1 + 0.3 * Math.max(0, kd.nae - 2.2));
  if (S.ua > 9) S.comp[BLOOD].sec[sDAMP] += 0.03 * (S.ua - 9);
  const sc = 0.02 * Math.min(2.5, S.ua / 5);                                                // urate: the main plasma antioxidant
  S.comp[BLOOD].sig[sROS] *= 1 - sc; for (let t = 0; t < NT; t++) S.comp[t].sig[sROS] *= 1 - 0.4 * sc;
  S.ldh += S.relLDH + 0.02 * (S.tumTot || 0) - (S.ldh - 165) * 0.03; S.relLDH = 0;
  S.ck += S.relCK + 60 * S.exer - (S.ck - 90) * 0.02; S.relCK = 0;
  // Cairo–Bishop laboratory tumour lysis: ≥ 2 of urate, K⁺, phosphate, Ca after a burst of tumour killing
  S.tumKillD = S.tumKillD * (23 / 24) + S.tumKill; S.tumKill = 0;
  const cb = (S.ua >= 8 ? 1 : 0) + (S.k >= 6 ? 1 : 0) + (S.pM * P_MG >= 4.5 ? 1 : 0) + (S.caM * CA_MG <= 7 ? 1 : 0);
  if (!S.flags.tls && cb >= 2 && S.tumKillD > 120) { S.flags.tls = 1; ev(S, 'tls', { ua: S.ua }); } else if (S.flags.tls && cb === 0) S.flags.tls = 0;
}

/* ---------------- iron: recycling, stores, hepcidin ---------------- */
function physIron(S) {
  const bl = S.comp[BLOOD].sig, il6 = bl[sIL6] * SIG_U[sIL6], liv = S.tis[LIVER], Lf = clamp(liv.H / liv.H0, 0, 1), gut = S.tis[GUT];
  // hepcidin: hepatocyte program output, scaled by hepatocyte mass; it internalises ferroportin
  S.hepc = clamp(1 + 5 * Math.pow(Math.max(0, Math.min(9, S.body.hor[hHPC])), 1.2), 0.5, 150) * (0.3 + 0.7 * Lf);
  const fN = (1 / (1 + Math.pow(S.hepc / 10, 1.3))) / 0.6;
  // macrophages recycle senescent red cells and haptoglobin-bound haemoglobin (CD163): what ferroportin does not
  // export is locked into macrophage ferritin (part of the stores), so hepcidin really withholds iron
  const fNc = Math.min(1.6, fN);
  S.feM += 2500 * (S.spn.feIn + S.hemoB);                                                 // culled red cells (red pulp · Kupffer · marrow) + haptoglobin–Hb
  const kO = 0.5 * fNc, kT = Math.min(0.95, kO + 0.4), mOut = S.feM * kT * kO / (kO + 0.4), mSto = S.feM * kT - mOut;
  S.feM -= mOut + mSto; S.feS += mSto;
  // hepatocyte / macrophage ferritin release: with hepcidin suppressed (erythroid drive) replete stores are mobilised
  // several-fold, so a marrow with iron in the bank is not held back by the plasma pool
  const fR = fNc <= 0.88 ? fNc : 0.88 * Math.pow(fNc / 0.88, 2.5);
  const sOut = Math.min(S.feS * 0.05, S.feS * 0.00247 * fR * (0.4 + 0.6 * Lf));
  const absF = clamp(gut.H / gut.H0, 0, 1) * (1 - S.steal);
  const abs = 0.06 * fNc * (1 + 6 * Math.max(0, 1 - S.feS / 500)) * (S.env.food ? 1 : 0.3) * absF;   // DMT1 / ferroportin up in deficiency
  const sup = mOut + sOut + abs + 750 * S.hemoFree;
  // plasma transferrin iron is a ≈ 3 mg pool that turns over every hour or two: it settles at the ratio of supply to
  // erythroid transferrin-receptor demand (the haem synthesis the marrow is trying to do, iron or not); haem
  // synthesis that finds no iron is undone (no iron, no haemoglobin)
  const want = 2500 * Math.max(S.rbcWant, S.rbcMade);
  let ery = 2500 * S.rbcMade;
  if (sup < ery + 0.04) { const short = ery + 0.04 - sup; S.rbc = Math.max(0.05, S.rbc - short / 2500); ery = Math.max(0, sup - 0.04); }
  S.feS = Math.max(5, S.feS + Math.max(0, sup - ery - 0.04) - sOut);
  S.eryD += (want - S.eryD) * 0.08;                                                          // erythroid precursor mass (TfR) changes over a day
  const fT = 3 * Math.pow(sup / Math.max(0.5, S.eryD + 0.4), 1.2);
  S.feP = clamp(S.feP + (fT - S.feP) * 0.5, 0.05, 40);
  // transferrin: negative acute-phase protein, up in iron deficiency, down in starvation
  const trT = (1 + 0.6 * Math.max(0, 1 - S.feS / 300)) * (1 - 0.3 * Math.min(1, il6 / 150)) * (1 - 0.15 * S.fast);
  S.trf += (trT - S.trf) * 0.01;
  S.fe = S.feP / (3 * Math.max(0.4, S.pvF)) * 100;
  S.tsat = clamp(S.fe / (300 * S.trf), 0, 1.2); S.tsatS += (S.tsat - S.tsatS) * 0.2;
  S.nfe = clamp(Math.max(0, S.tsat - 0.7) * 2 + S.hemoFree * 60, 0, 2);                    // non-transferrin-bound iron / free haem
  S.ironF = clamp(0.35 + 0.65 * (S.tsatS - 0.04) / 0.14, 0.35, 1);                          // iron-restricted erythropoiesis below ≈ 18 % TSAT
  S.feAvail = clamp(S.tsat / 0.33, 0.05, 2.5) + 2 * S.nfe;
  S.ferr = (S.feS + 2 * S.feM) * 0.11 * (1 + 1.2 * Math.min(1, (S.crp || 0) / 80));
  S.retic += (S.rbcMade / Math.max(0.2, S.rbc) * 500 - S.retic) * 0.15; S.rbcMade = 0; S.rbcWant = 0;
}

/* ---------------- haemostasis: platelets, factors, fibrinogen, fibrinolysis, venous thrombosis ---------------- */
function physCoag(S, Bc) {
  const K = S.K, bl = S.comp[BLOOD].sig, liv = S.tis[LIVER], Lf = clamp(liv.H / liv.H0, 0, 1), env = S.env;
  const il6 = bl[sIL6] * SIG_U[sIL6], tnf = bl[sTNF] * SIG_U[sTNF];
  // procoagulant drive: monocyte / macrophage tissue factor (program), NETs, endotoxaemia, venom, tumours, necrosis
  let tf = 0; for (let c = 0; c < NC; c++) tf += K.tf[c];
  S.coagA = 0.01 * tf + 0.0006 * (K.net[BLOOD] + 0.3 * (K.net[LUNG] + K.net[LIVER])) + 0.015 * Math.min(4, S.septicH || 0) + S.coagX + 0.00001 * (S.tumTot || 0) + 0.00003 * S.necH;
  S.coagX = 0;
  // venom enzymes clot fibrinogen directly (non-crosslinked fibrin, rapidly lysed): fibrinogen and factors vanish,
  // D-dimer soars, platelets are relatively spared
  if (S.coagV > 0) {
    const v = S.coagV; S.coagV = 0;
    S.fib -= S.fib * Math.min(0.6, 2 * v); S.fac -= S.fac * Math.min(0.5, 1.2 * v); S.plt -= S.plt * Math.min(0.08, 0.08 * v);
    S.ddim += 15 * Math.min(2, v);
  }
  // immunothrombosis: tissue factor and NETs trap microbes in microvessels (read by the pathogen step next hour)
  for (let c = 0; c < NC; c++) S.trap[c] = clamp(K.tf[c] * 0.004 + K.net[c] * 0.002, 0, 0.6);
  // microthrombi; sepsis (TNF → PAI-1) shuts fibrinolysis down
  const lys = 0.06 * (1 - 0.5 * Math.min(1, tnf / 60));
  S.mtb = clamp(S.mtb + 0.08 * S.coagA - S.mtb * lys, 0, 1);
  // consumption
  const cA = S.coagA;
  S.plt -= S.plt * Math.min(0.25, 0.15 * cA * (1 + S.mtb)) + S.plt * 0.006;
  S.fac -= S.fac * Math.min(0.2, 0.12 * cA);
  S.fib -= S.fib * Math.min(0.25, 0.15 * cA);
  if (S.rbcBledH > 0) S.plt -= S.plt * Math.min(0.5, 0.5 * S.rbcBledH / Math.max(0.1, S.rbc + S.rbcBledH));   // lost with blood, diluted by refill
  // hepatic synthesis (factors t½ hours, fibrinogen an acute-phase protein)
  S.fac += 0.05 * (Math.pow(Lf, 0.8) * (S.fast > 0.8 ? 0.9 : 1) * (0.8 + 0.2 * Math.min(1.2, S.lob.xpF)) * S.lob.vkF - S.fac);   // zone-1 export synthesis · vitamin K
  S.fib += ((300 * (1 + 1.2 * Math.min(1, il6 / 150))) * (0.3 + 0.7 * Lf) - S.fib) * 0.03;
  S.plt = clamp(S.plt, 1, 1500); S.fac = clamp(S.fac, 0.03, 1.3); S.fib = clamp(S.fib, 20, 1000);
  // haemostatic capacity: count × factors × fibrinogen, crippled by cold, acidaemia and low ionised Ca
  const tempF = S.temp < 35 ? clamp(1 - 0.1 * (35 - S.temp), 0.4, 1) : 1, phF = S.pH < 7.2 ? clamp(1 - 2 * (7.2 - S.pH), 0.4, 1) : 1;
  const caF = S.ica < 0.85 ? clamp(0.4 + (S.ica - 0.5) / 0.35 * 0.6, 0.4, 1) : 1;
  S.hemF = Math.pow(clamp(S.plt / 60, 0.02, 1), 0.7) * Math.pow(clamp(S.fac, 0.05, 1), 0.8) * Math.pow(clamp(S.fib / 120, 0.05, 1), 0.4) * tempF * phF * caF;
  if (S.hemF < 0.35) S.bleedCoag += 0.004 * (0.35 - S.hemF) / 0.35;                         // mucosal / GI oozing (applied next hour)
  const br = S.tis[BRAIN];
  if (S.hemF < 0.25 && S.rng() < 0.0025 * (0.25 - S.hemF) / 0.25 * (S.bp > 110 ? 2 : 1)) {   // intracranial haemorrhage
    const k = br.H * 0.06; br.necX += k; br.kills.hem += k; ev(S, 'ich', {});
  }
  // microvascular occlusion: organ ischaemia and red-cell shearing
  if (S.mtb > 0.02) {
    const m2 = S.mtb * S.mtb;
    for (const t of [LUNG, GUT, LIVER]) { const ts = S.tis[t], k = ts.H * 0.0015 * m2; ts.necX += k; ts.kills.hyp += k; }
    { const k = br.H * 0.0008 * m2; br.necX += k; br.kills.hyp += k; }
    S.hemoX += 0.002 * S.mtb;
  }
  // venous stasis (bed rest, low output, haemoconcentration) × hypercoagulability (inflammation, cancer, fibrinogen)
  const stasis = clamp(0.5 * env.rest + 0.35 * Math.min(1, Bc.RST / 9) + 0.25 * Math.max(0, 3.5 - S.cv.co) + 1.5 * Math.max(0, S.hbF - 1.1) - 0.6 * S.exer, 0, 1.5);
  const hyper = 1 + 0.8 * Math.min(1, (S.crp || 0) / 120) + 1.2 * Math.min(1, (S.tumTot || 0) / 1200) + 0.5 * Math.max(0, S.fib - 400) / 200 + 10 * cA;
  S.dvt = clamp(S.dvt + 0.0025 * stasis * stasis * hyper * (S.plt > 50 ? 1 : 0.3) - S.dvt * (0.012 + 0.03 * S.exer), 0, 1);
  if (S.dvt > 0.05 && S.rng() < 0.006 * S.dvt) { const e = S.dvt * (0.4 + 0.6 * S.rng()); S.pe = Math.min(1, S.pe + e * 0.9); S.dvt -= e * 0.6; ev(S, 'pe', { sz: e }); }
  S.pe = Math.max(0, S.pe - S.pe * 0.025 * (1 - 0.4 * Math.min(1, tnf / 60)));
  // D-dimer (FEU): fibrin degradation from microthrombi, venous clot and haematoma
  S.ddim = clamp(S.ddim + 8 * S.mtb * lys + 0.06 * S.dvt + 0.12 * S.pe + 2 * S.rbcBledH - (S.ddim - 0.25) * 0.085, 0.1, 80);
  // ISTH overt-DIC score
  const inr = 1 / Math.pow(S.fac, 1.3);
  S.dic = (S.plt < 50 ? 2 : S.plt < 100 ? 1 : 0) + (S.ddim > 5 ? 3 : S.ddim > 1 ? 2 : 0) + (inr > 1.7 ? 2 : inr > 1.3 ? 1 : 0) + (S.fib < 100 ? 1 : 0);
  if (!S.flags.dic && S.dic >= 5) { S.flags.dic = 1; ev(S, 'dic', {}); } else if (S.flags.dic && S.dic <= 2) S.flags.dic = 0;
  S.rbcBledH = 0;
}

function buildSprite() {
  let s = '<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>';
  const seen = new Set();
  for (const t0 of SK.TOKS) {
