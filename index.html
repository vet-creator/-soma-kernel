<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>SOMA//KERNEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* SOMA//KERNEL — one dark world: neon instrument panel over a living mandala.
   layout: HUD / main (soma map + panel) / tab bar; single column on phones, two on wide screens */
:root{
  color-scheme:dark;
  --bg:#04060b; --bg2:#080c15; --panel:#0b101b; --panel2:#0f1524; --line:#19233a; --line2:#27354f;
  --ink:#dfe8f7; --dim:#8492ab; --mute:#4d5a73;
  --cy:#5ad1ff; --mg:#ff4fa0; --am:#ffcf6a; --gr:#54e3b0; --vi:#c58bff; --rd:#ff5d5d;
  --f-ui:"Chakra Petch","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.25;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--cy);outline-offset:1px}
svg.g{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(120% 70% at 50% 0%,#0b1322 0%,var(--bg) 60%)}

/* ---------- HUD ---------- */
#hud{flex:none;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(13,19,33,.96),rgba(7,10,18,.96));padding:5px 10px 6px;display:grid;gap:5px}
.h1{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--ink);white-space:nowrap}
.brand i{color:var(--mg);font-style:normal}
.clock{font-family:var(--f-num);font-size:11px;color:var(--dim);margin-left:2px;white-space:nowrap}
.spd{margin-left:auto;display:flex;gap:3px}
.spd button,.ibtn{width:30px;height:26px;border:1px solid var(--line2);border-radius:5px;display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.spd button.on{color:var(--bg);background:var(--cy);border-color:var(--cy)}
.spd svg,.ibtn svg{width:14px;height:14px;fill:currentColor}
.ibtn{font-weight:700;font-size:13px}
.h2{display:flex;align-items:center;gap:10px}
#brain{position:relative;width:50px;height:50px;flex:none}
#brain svg{width:50px;height:50px;transform:rotate(-90deg)}
#brain .trk{fill:none;stroke:var(--line2);stroke-width:4}
#brain .arc{fill:none;stroke:var(--gr);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .3s,stroke .3s}
#brain .lim{fill:none;stroke:var(--rd);stroke-width:6;stroke-dasharray:1.2 200}
#brain b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:600}
#brain.crit b{color:var(--rd);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hmid{flex:1;min-width:0;display:grid;gap:4px}
.ebar{display:flex;align-items:center;gap:6px}
.ebar .lab{color:var(--am);font-weight:700;font-size:11px;letter-spacing:.08em}
.ebar .trk{flex:1;height:9px;border-radius:5px;background:#0a0f1a;border:1px solid var(--line2);overflow:hidden;display:flex}
.ebar .trk i{display:block;height:100%}
.ebar .s1{background:var(--cy)} .ebar .s2{background:var(--am)} .ebar .s3{background:#a9772e}
.ebar .v{font-family:var(--f-num);font-size:12px;min-width:38px;text-align:right}
.ebar .d{font-family:var(--f-num);font-size:10px;color:var(--dim);min-width:40px;text-align:right}
.ebar .d.neg{color:var(--rd)} .ebar .d.pos{color:var(--gr)}
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.vit span{border:1px solid var(--line);border-radius:4px;padding:1px 5px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;background:rgba(12,17,28,.7)}
.vit em{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.06em}
.vit b{font-family:var(--f-num);font-weight:500;font-size:12px}
.vit .warn{border-color:#6b5320}.vit .warn b{color:var(--am)}
.vit .crit{border-color:#7a2a35}.vit .crit b{color:var(--rd)}
.h3{display:flex;align-items:center;gap:6px;min-width:0}
.phc{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:6px;padding:2px 7px 2px 4px;min-width:0;flex:1;position:relative;overflow:hidden;background:var(--panel);min-height:29px}
.phc.bad{border-color:#5a2740}.phc.good{border-color:#1f5a4b}
.phc .pr{position:absolute;left:0;bottom:0;height:2px;background:var(--cy)}
.phc.bad .pr{background:var(--mg)} .phc.good .pr{background:var(--gr)}
.phc svg{width:20px;height:20px;flex:none}
.phc .nm{font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phc .lv{font-family:var(--f-num);font-size:10px;color:var(--dim);margin-left:auto;white-space:nowrap}
.pq{display:flex;gap:3px;flex:none}
.pq span{width:27px;height:27px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;position:relative;color:var(--dim)}
.pq span.bad{color:#ff8fbd;border-color:#3d2233}.pq span.good{color:#7fe9c6;border-color:#1c3c36}
.pq svg{width:16px;height:16px}
.pq sub{position:absolute;right:1px;bottom:-1px;font-family:var(--f-num);font-size:8px;color:var(--dim)}
svg.pi{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
.phw{position:relative;flex:1;min-width:0;display:flex}
#tick{position:absolute;inset:0;border-radius:6px;display:none;align-items:center;gap:7px;padding:0 9px 0 6px;background:#0c1322;border:1px solid var(--line2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--ink);animation:tin .2s ease-out}
#tick.on{display:flex}#tick.bad{border-color:#7a2f52;color:#ffb3d1;background:#1a0c18}#tick.good{border-color:#23705c;color:#9af0d4;background:#08171a}
#tick span{overflow:hidden;text-overflow:ellipsis}
.phc.flash{animation:pflash .9s ease-out}
@keyframes pflash{0%{box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 26px rgba(255,255,255,.5)}100%{box-shadow:none}}

/* ---------- main / views ---------- */
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#070a12}
#nav button{height:46px;display:grid;place-items:center;gap:0;color:var(--mute);font-size:9px;letter-spacing:.18em;position:relative}
#nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--cy)}
#nav button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#nav button .dot{position:absolute;top:7px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--mg);box-shadow:0 0 6px var(--mg);display:none}
#nav button.alert .dot{display:block}

/* ---------- SOMA ---------- */
#bodyWrap{position:relative;flex:0 0 52%;min-height:210px;overflow:hidden;border-bottom:1px solid var(--line)}
#bodyCv{position:absolute;inset:0;width:100%;height:100%}
.org{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.org .ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.org .trk{fill:rgba(6,9,16,.78);stroke:var(--line2);stroke-width:2.5}
.org .arc{fill:none;stroke:var(--cy);stroke-width:2.5;stroke-linecap:round}
.org .inf{fill:none;stroke:var(--mg);stroke-width:2.5}
.org .tum{fill:none;stroke:var(--vi);stroke-width:2.5}
.org svg.g{width:26px;height:26px;position:relative}
.org.sel .trk{stroke:var(--ink)}
.org.sel::after{content:"";position:absolute;inset:-5px;border:1px solid rgba(223,232,247,.55);border-radius:50%}
.org.low svg.g{color:var(--rd)!important}
.org i{position:absolute;right:-4px;top:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--mg);color:#12060c;font:600 9px var(--f-num);display:none;place-items:center;padding:0 3px;font-style:normal}
.org i.on{display:grid}
.org u{position:absolute;left:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--vi);display:none;text-decoration:none}
.org u.on{display:block;box-shadow:0 0 8px var(--vi)}
#detail{flex:1;min-height:0;overflow:auto;padding:8px 10px 14px;display:grid;gap:9px;align-content:start;-webkit-overflow-scrolling:touch}
.dh{display:flex;align-items:center;gap:8px}
.dh h2{margin:0;font-size:13px;letter-spacing:.18em;font-weight:600}
.dh .fn{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--dim)}
.tb{height:10px;border-radius:5px;overflow:hidden;display:flex;background:#1a0d14;border:1px solid var(--line2)}
.tb i{display:block;height:100%}
.tb .h{background:linear-gradient(90deg,#2aa5c7,var(--cy))}.tb .i{background:var(--mg)}.tb .t{background:var(--vi)}
.sec{display:grid;gap:5px}
.sec>h3{margin:0;font-size:9px;letter-spacing:.22em;color:var(--mute);font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.sgc{border:1px solid var(--line);border-radius:5px;padding:3px 2px 2px;display:grid;justify-items:center;gap:1px;background:var(--panel)}
.sgc svg.g{width:18px;height:18px}
.sgc b{font:500 10px var(--f-num);color:var(--dim)}
.sgc .lv{width:26px;height:3px;background:#101828;border-radius:2px;overflow:hidden}
.sgc .lv s{display:block;height:100%;background:currentColor}
.sgc.z{opacity:.38}
.cl{display:grid;gap:3px}
.cr{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--panel)}
.cr svg.g{width:19px;height:19px}
.cr .n{font:500 12px var(--f-num);min-width:44px}
.cr .sb{flex:1;height:6px;border-radius:3px;overflow:hidden;display:flex;background:#101828}
.cr .sb i{display:block;height:100%}
.cr .st{display:flex;gap:4px;font:400 10px var(--f-num);color:var(--dim)}
.thr{border:1px solid #4a2238;border-radius:6px;padding:6px 7px;background:linear-gradient(180deg,rgba(40,12,28,.55),rgba(14,10,20,.6));display:grid;gap:5px}
.thr.tu{border-color:#3d2a5c;background:linear-gradient(180deg,rgba(32,18,56,.55),rgba(12,10,22,.6))}
.thr .t1{display:flex;align-items:center;gap:7px}
.thr .t1 svg.pi{width:20px;height:20px;color:#ff8fbd}
.thr.tu .t1 svg.pi{color:var(--vi)}
.thr .t1 b{font:600 12px var(--f-num)}
.thr .t1 span{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.thr .t1 em{margin-left:auto;font:400 10px var(--f-num);color:var(--dim);font-style:normal}
.trs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:3px 8px}
.trs span{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:4px;font:400 9px var(--f-num);color:var(--dim)}
.trs span.up{color:var(--am)}
.trs s{display:block;height:4px;background:#1b1422;border-radius:2px;overflow:hidden;text-decoration:none}
.trs s i{display:block;height:100%;background:#ff8fbd}
.trs span.up s i{background:var(--am)}
.kbs{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.kbs span{display:grid;justify-items:center;gap:1px}
.kbs svg.g{width:15px;height:15px}
.kbs s{display:block;width:16px;height:14px;position:relative;text-decoration:none;background:#151022;border-radius:2px;overflow:hidden}
.kbs s i{position:absolute;left:0;right:0;bottom:0;background:var(--cy)}
svg.sig{width:22px;height:22px;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:3px 10px}
.kv span{display:flex;justify-content:space-between;font:400 10px var(--f-num);color:var(--dim);border-bottom:1px dotted var(--line)}
.kv b{color:var(--ink);font-weight:500}
.abr{display:flex;flex-wrap:wrap;gap:4px}
.abr span{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:5px;padding:1px 5px 1px 2px;font:400 10px var(--f-num);color:var(--dim)}
.abr svg.g{width:15px;height:15px}

/* ---------- CODE ---------- */
#cells{flex:none;display:flex;gap:4px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);scrollbar-width:none}
#cells::-webkit-scrollbar{display:none}
.cb{flex:none;width:42px;height:44px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;position:relative;background:var(--panel);padding-bottom:5px}
.cb svg.g{width:24px;height:24px}
.cb.on{border-color:var(--ink);background:var(--panel2);box-shadow:0 0 0 1px rgba(223,232,247,.25) inset}
.cb .pl{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:#131b2c;overflow:hidden}
.cb .pl i{display:block;height:100%;background:var(--gr)}
.cb .bd{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;display:none}
.cb.mut .bd{display:block;background:var(--mg);box-shadow:0 0 6px var(--mg)}
.cb.pend .bd{display:block;background:var(--am);box-shadow:0 0 6px var(--am)}
.cb.drt{border-style:dashed}
#chead{flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);min-height:34px}
#chead h2{margin:0;font-size:12px;letter-spacing:.16em;font-weight:600;white-space:nowrap}
#chead .cnt{font:400 11px var(--f-num);color:var(--dim)}
#stleg{display:flex;gap:6px;margin-left:auto;align-items:center;overflow-x:auto;scrollbar-width:none}
#stleg span{display:flex;align-items:center;gap:2px;font-size:9px;color:var(--dim);white-space:nowrap;letter-spacing:.04em}
#stleg svg.g{width:14px;height:14px}
#probe{flex:none;display:flex;gap:3px;padding:4px 8px;border-bottom:1px solid var(--line);align-items:center;overflow-x:auto;scrollbar-width:none}
#probe em{font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--mute);margin-right:3px}
#probe button{width:30px;height:24px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;color:var(--dim);font:600 11px var(--f-num)}
#probe button svg.g{width:16px;height:16px;color:inherit!important}
#probe button.on{border-color:var(--cy);color:var(--cy);background:rgba(90,209,255,.08)}
#probe button.z{opacity:.3}
#code{flex:1;min-height:0;overflow:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.ln{display:flex;align-items:flex-start;gap:0;padding:1px 6px 1px 0;border-left:2px solid transparent}
.ln.cur{background:rgba(90,209,255,.045);border-left-color:var(--cy)}
.ln.err{border-left-color:var(--rd);background:rgba(255,93,93,.05)}
.ln.new{border-left-color:var(--gr)}
.gut{flex:none;width:36px;height:30px;display:grid;grid-template-columns:16px 14px;align-items:center;justify-items:end;gap:3px;color:var(--mute);font:400 9px var(--f-num)}
.gut .led{width:5px;height:22px;border-radius:2px;background:#101828;position:relative;overflow:hidden;justify-self:start;margin-left:3px}
.gut .led i{position:absolute;left:0;right:0;bottom:0;background:var(--gr);box-shadow:0 0 6px var(--gr)}
.gut .led.g1{background:#16283a}
.tks{flex:1;display:flex;flex-wrap:wrap;gap:2px;min-height:30px;align-items:center}
.tk{width:29px;height:29px;border-radius:5px;display:grid;place-items:center;position:relative;border:1px solid transparent}
.tk svg.g{width:21px;height:21px}
.tk.c-sen,.tk.c-sig,.tk.c-hor,.tk.c-dual,.tk.c-cell,.tk.c-comp{background:rgba(143,214,255,.055)}
.tk.c-act,.tk.c-verb,.tk.c-ig,.tk.c-halt{background:rgba(255,255,255,.06)}
.tk.c-state{background:rgba(205,188,255,.09)}
.tk.c-arrow{width:34px}
.tk.c-arrow svg.g{width:26px;height:22px}
.tk.c-num{font:600 15px var(--f-num);color:#ffd98a;width:22px}
.tk.r-arg{background:rgba(255,217,138,.1)}
.tk.sel{border-color:var(--ink);background:rgba(223,232,247,.14);box-shadow:0 0 10px rgba(90,209,255,.35)}
.tk.bad{border-color:var(--rd);background:rgba(255,93,93,.18)}
.tk.mut{animation:glitch .9s steps(3) infinite;border-color:var(--mg)}
@keyframes glitch{0%{transform:translate(0,0)}33%{transform:translate(1px,-1px)}66%{transform:translate(-1px,1px)}}
.caret{width:2px;height:22px;background:var(--cy);border-radius:1px;animation:blink 1s steps(2) infinite;margin:0 -3px 0 -1px;position:relative;z-index:1;flex:none}
#insp{flex:none;display:flex;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid var(--line);min-height:36px;background:#070b13}
#insp .big svg.g{width:24px;height:24px}
#insp .tag{font-size:11px;letter-spacing:.1em;color:var(--ink);white-space:nowrap}
#insp .tag.unk{color:var(--mute)}
#insp .cls{font-size:8px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
#insp .lv7{display:flex;gap:3px;margin-left:auto}
#insp .lv7 span{display:grid;justify-items:center;font:500 10px var(--f-num);color:var(--dim);min-width:17px}
#insp .lv7 span svg.g{width:12px;height:12px;color:var(--mute)!important}
#insp .lv7 span.hot{color:var(--cy)}
#insp .step{display:flex;gap:4px;margin-left:auto}
#insp .step button{width:34px;height:26px;border:1px solid var(--line2);border-radius:5px;font:600 14px var(--f-num)}
#insp .msg{margin-left:auto;font-size:10px;letter-spacing:.08em;color:var(--am)}
#tools{flex:none;display:flex;gap:4px;padding:5px 8px;border-top:1px solid var(--line);align-items:center;background:#070b13}
#tools button{height:32px;min-width:30px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;color:var(--dim);background:var(--panel);padding:0 4px}
#tools button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.on{color:var(--cy);border-color:var(--cy)}
#tools button:disabled{opacity:.3}
#commit{margin-left:auto;gap:6px;grid-auto-flow:column;padding:0 9px!important;white-space:nowrap;min-width:84px;font:600 11px var(--f-num);letter-spacing:.06em;color:var(--mute)!important}
#commit.rdy{color:#04110d!important;background:var(--gr)!important;border-color:var(--gr)!important;box-shadow:0 0 14px rgba(84,227,176,.45)}
#commit.no{color:var(--rd)!important;border-color:#6d2b36!important}
#commit.busy{color:var(--am)!important;border-color:#6b5320!important}
#pal{flex:none;border-top:1px solid var(--line);background:#060910}
#ptabs{display:flex;gap:2px;padding:4px 8px 0;overflow-x:auto;scrollbar-width:none}
#ptabs button{flex:1;min-width:38px;height:26px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;display:grid;place-items:center;color:var(--mute)}
#ptabs button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ptabs button.on{color:var(--ink);background:var(--panel2);border-color:var(--line2)}
#pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:3px;padding:6px 8px 7px;height:122px;overflow:auto;align-content:start;background:var(--panel2);border-top:1px solid var(--line2)}
.pk{height:36px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:var(--panel);position:relative}

.pk.c-num{font:600 16px var(--f-num);color:#ffd98a}

/* ---------- SCOPE / CODEX ---------- */
.scroll{flex:1;min-height:0;overflow:auto;padding:10px;display:grid;gap:12px;align-content:start;-webkit-overflow-scrolling:touch}
.chart{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:6px 8px 4px}
.chart h3{margin:0 0 2px;font-size:9px;letter-spacing:.22em;color:var(--mute);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chart h3 span{display:flex;align-items:center;gap:4px;letter-spacing:.08em}

.chart canvas{width:100%;height:92px;display:block}
#log{display:grid;gap:2px}
#log div{display:flex;gap:8px;align-items:center;font:400 10px var(--f-num);color:var(--dim);border-bottom:1px dotted var(--line);padding:2px 0}
#log div b{color:var(--ink);font-weight:500;min-width:54px}
#log svg{width:15px;height:15px}
.atl{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.atc{border:1px solid var(--line);border-radius:6px;padding:5px 4px;display:grid;justify-items:center;gap:3px;background:var(--panel);min-height:54px}
.atc span{font-size:9px;letter-spacing:.06em;color:var(--dim);text-align:center}
.atc.unk span{color:var(--mute)}
.atc.unk svg.g{opacity:.55}
.help{display:grid;gap:7px;font-size:12px;color:var(--dim);line-height:1.45;max-width:62ch}
.help b{color:var(--ink);font-weight:600}
.help .row{display:flex;gap:8px;align-items:flex-start}
.help .row>svg{flex:none;margin-top:1px;width:22px;height:22px}
.help .ex{display:flex;gap:2px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel);width:fit-content}
.help .ex .tk{width:26px;height:26px}
.help .ex .tk svg.g{width:19px;height:19px}

/* ---------- overlays ---------- */
#ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,5,10,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;padding:16px;overflow:auto}

.card{width:min(460px,100%);border:1px solid var(--line2);border-radius:12px;background:linear-gradient(180deg,#0d1424,#080c16);padding:18px 16px 16px;display:grid;gap:12px;box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 0 1px rgba(90,209,255,.06) inset}
.card h1{margin:0;font-size:22px;letter-spacing:.2em;font-weight:700}
.card h1 i{font-style:normal;color:var(--mg)}
.card .sub{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:-6px}
.card .big{font:600 34px var(--f-num);letter-spacing:.02em}
.card .cause{font-size:12px;letter-spacing:.16em;color:var(--mg);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2 div{border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--panel)}
.grid2 em{display:block;font-style:normal;font-size:8px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.grid2 b{font:500 15px var(--f-num)}
.grid2.sm b{font-size:12px;white-space:nowrap}
.btn{height:44px;border-radius:8px;border:1px solid var(--cy);color:#03121a;background:var(--cy);font-weight:700;letter-spacing:.24em;font-size:13px;box-shadow:0 0 22px rgba(90,209,255,.35)}
.btn.ghost{background:none;color:var(--dim);border-color:var(--line2);box-shadow:none}
.card canvas{width:100%;height:70px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.seedrow{display:flex;gap:8px;align-items:center;font:400 10px var(--f-num);color:var(--mute)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- wide screens: body map stays, panel beside it ---------- */
body.wide #main{display:grid;grid-template-columns:minmax(380px,40%) 1fr}
body.wide .view{position:relative;inset:auto}
body.wide #v-soma{display:flex;border-right:1px solid var(--line)}

.org.sat{width:46px;height:46px;margin:-23px 0 0 -23px}

.org.sat.sel::after{inset:-4px}

.odp{display:grid;gap:9px;align-content:start}
.ecg{position:relative;height:76px;border:1px solid #173a33;border-radius:6px;overflow:hidden;
  background:linear-gradient(rgba(84,227,176,.07) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(84,227,176,.07) 1px,transparent 1px) 0 0/12px 12px,#030b0a}

.mass{height:10px;border-radius:5px;overflow:hidden;display:flex;background:#101828;border:1px solid var(--line2)}

.mleg{display:flex;gap:12px;font:500 10px var(--f-num);color:var(--dim)}

.segs{display:grid;gap:4px;grid-template-columns:repeat(3,1fr)}

.seg{border:1px solid var(--line);border-radius:6px;padding:4px 5px;background:var(--panel);display:grid;gap:3px;align-content:start;min-width:0}
.seg em{font-style:normal;font-size:8.5px;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg em svg.g{width:12px;height:12px}
.sd{display:grid;gap:2px}
.sd span{display:flex;align-items:center;gap:3px;opacity:.38}
.sd span.on{opacity:1}
.sd svg.g{width:14px;height:14px}
.sd s{flex:1;height:3px;border-radius:2px;background:#101828;overflow:hidden}
.sd s i{display:block;height:100%;background:currentColor;color:var(--cy)}
.chain{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chain::-webkit-scrollbar{display:none}
.cn{flex:1 0 56px;border:1px solid #3c3320;border-radius:5px;padding:3px 4px;background:linear-gradient(180deg,rgba(40,32,12,.5),rgba(12,12,18,.6));display:grid;gap:2px}
.cn em{font-style:normal;font-size:7.5px;letter-spacing:.1em;color:var(--dim);white-space:nowrap}
.cn b{font:600 11px var(--f-num);color:var(--am)}
.cn s{height:3px;border-radius:2px;background:#101828;overflow:hidden}
.cn s i{display:block;height:100%;background:var(--am)}
.ca{align-self:center;color:var(--mute);font-size:12px}
.mts{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:3px 12px}
.mt{display:grid;grid-template-columns:1fr 46px auto;align-items:center;gap:6px;font:400 10px var(--f-num);color:var(--dim);border-bottom:1px dotted var(--line);padding:1px 0}
.mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt s{height:3px;border-radius:2px;background:#101828;overflow:hidden}
.mt s i{display:block;height:100%;background:var(--cy)}
.mt b{color:var(--ink);font-weight:500;text-align:right;white-space:nowrap}
.mt.w1 b{color:var(--am)}.mt.w1 s i{background:var(--am)}
.mt.w2 b{color:var(--rd)}.mt.w2 s i{background:var(--rd)}
#probe .pst{display:inline-flex;align-items:center;gap:3px;font-size:9px;letter-spacing:.06em;color:var(--dim);margin-left:6px;white-space:nowrap}
#probe .pst svg.g{width:13px;height:13px}
#hud>*{min-width:0}
@media (max-width:430px){
  .h1{gap:5px}
  .brand{letter-spacing:.08em;font-size:11.5px}
  .clock{font-size:10.5px}
  .spd{gap:2px}
  .spd button,.ibtn{width:27px}
}
/* ---------- v4: continuous numbers ---------- */
.tk.c-num{width:auto;min-width:22px;padding:0 4px;font:600 13px var(--f-num)}
.tk.c-num .nv{white-space:nowrap;letter-spacing:-.02em}
.pk.c-num{font:600 13px var(--f-num)}
#insp .nvb{font:600 17px var(--f-num);color:#ffd98a;padding:0 2px;white-space:nowrap}
#insp .nvb.ed{border-bottom:2px solid #ffd98a;animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{border-color:transparent}}
#insp .step .stp{width:auto;padding:0 6px;font:500 10px var(--f-num);color:var(--dim)}
#insp .lv7 span{font-size:9px;min-width:19px}
.kpad{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.pk.kp{font:600 15px var(--f-num);color:#ffd98a;height:27px}
.pk.kp.kn{color:var(--cy)}
@media (min-width:420px){.kpad{grid-template-columns:repeat(8,1fr)}.pk.kp{height:34px}}
/* ---------- ICU bedside monitor ---------- */
.icu{background:#020406;padding:6px 8px 14px;display:flex;flex-direction:column;gap:6px}
.ialarm{display:flex;align-items:baseline;gap:10px;padding:5px 9px;border-radius:5px;border:1px solid #14202c;background:#06101a;min-height:28px;flex-wrap:wrap}
.ialarm .ia-t{font:600 11px var(--f-num);letter-spacing:.14em;color:#7d8aa3}
.ialarm .ia-l{font:400 9.5px var(--f-num);color:var(--dim);letter-spacing:.06em}
.ialarm.p1{border-color:#1f6f8a;background:rgba(32,150,190,.12)}.ialarm.p1 .ia-t{color:#5ad1ff}
.ialarm.p2{border-color:#8a6a10;background:rgba(255,207,106,.12)}.ialarm.p2 .ia-t{color:#ffcf6a;animation:blink 1.6s steps(2) infinite}
.ialarm.p3{border-color:#b02a3a;background:rgba(255,60,80,.18)}.ialarm.p3 .ia-t{color:#ff6b78;animation:blink .55s steps(2) infinite}
.ichs{display:grid;gap:2px}
.ich{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:stretch;border-bottom:1px solid #0b1520}
.ich .iw{position:relative;height:50px;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/100% 12.5px}
.ich canvas{position:absolute;inset:0;width:100%;height:100%}
.ich .il{position:absolute;left:3px;top:1px;font:600 9px var(--f-num);color:var(--cc);letter-spacing:.08em;opacity:.85}
.ich .isc{position:absolute;left:3px;bottom:1px;font:400 8px var(--f-num);color:var(--cc);opacity:.6}
.inum{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-content:center;color:var(--cc);padding:1px 2px}
.inum b{font:600 19px var(--f-num);line-height:1;grid-row:1/3;align-self:center;white-space:nowrap}
.inum b.big{font-size:25px}
.inum em{font-style:normal;font:500 8.5px var(--f-num);letter-spacing:.08em;opacity:.85;justify-self:end}
.inum small{font:400 8.5px var(--f-num);opacity:.8;justify-self:end;white-space:nowrap}
.inum small.r1{color:#ffcf6a}.inum small.r2,.inum small.r3{color:#ff6b78;animation:blink .6s steps(2) infinite}
.inum .hb{font-style:normal;opacity:.25}.inum .hb.on{opacity:1}
.itiles{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.itile{border:1px solid #102030;border-radius:5px;padding:3px 4px;display:grid;background:#05090f}
.itile em{font-style:normal;font:500 8px var(--f-num);color:var(--mute);letter-spacing:.06em;white-space:nowrap}
.itile b{font:600 14px var(--f-num);color:var(--ink)}
.itile small{font:400 8px var(--f-num);color:var(--mute)}
.itile.w b{color:#ffcf6a}
@media (max-width:430px){.itiles{grid-template-columns:repeat(3,1fr)}.ich{grid-template-columns:1fr 84px}}
.itrend{position:relative;height:64px;border:1px solid #102030;border-radius:5px;background:#05090f}
.itrend canvas{position:absolute;inset:0;width:100%;height:100%}
.itl{position:absolute;right:6px;top:3px;display:flex;gap:8px;font:500 8.5px var(--f-num);color:var(--mute)}
.ilabs{display:grid;gap:8px}
.ls h3{font:600 9px var(--f-ui);letter-spacing:.22em;color:var(--mute);margin:2px 0 3px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px 12px}
.lr{display:grid;grid-template-columns:1fr 50px 10px 52px;gap:4px;align-items:baseline;font:400 10px var(--f-num);color:var(--dim);border-bottom:1px dotted #0e1a26;padding:1px 0}
.lr b{color:var(--ink);font-weight:500;text-align:right}
.lr i{font-style:normal;font-weight:700;color:#ffcf6a}
.lr small{color:var(--mute);font-size:8.5px;white-space:nowrap;overflow:hidden}
.lr em{display:none}
.lr.f b{color:#ffcf6a}.lr.fc b,.lr.fc i{color:#ff6b78}
@media (min-width:980px){.lr{grid-template-columns:1fr 54px 10px 54px 64px}.lr em{display:block;font-style:normal;font-size:8.5px;color:#3d4a60;text-align:right}}
.icu>*{flex:none}

<div id="app">
  <header id="hud">

  </main>
  <nav id="nav"></nav>
</div>
<script>
/* ============================================================
   SOMA//KERNEL — core 1 : glyph tokens + CYTOGLYPH language
   ============================================================ */
(function (G) {
'use strict';
const SK = G.SK = G.SK || {};

/* ---------- small utils ---------- */
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
/* log level 0..9 : 0.5→1, 1→2, 2→3, 4→4, 8→5, 16→6, 32→7, 64→8, 128→9 */
const lvl = x => x < 0.5 ? 0 : Math.min(9, 1 + Math.floor(Math.log2(x / 0.5) + 1e-9));
/* ratio level : 1.0 → 5 */
const rl = x => clamp(Math.floor(5 * x + 0.5), 0, 9);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
SK.util = { clamp, lvl, rl, mulberry32 };

/* ---------- compartments / types ---------- */
const COMPS = ['LUNG', 'GUT', 'LIVER', 'BRAIN', 'BLOOD', 'NODE', 'MARROW'];
const TYPES = ['BODY', 'CAR', 'NEP', 'ISL', 'HSC', 'NEU', 'MAC', 'DC', 'MAST', 'NK', 'TH', 'TC', 'BC', 'EPI', 'HEP', 'NRN'];
SK.COMPS = COMPS; SK.TYPES = TYPES;

/* ---------- glyph drawing helpers (24x24, stroke) ---------- */
const c = (x, y, r, f) => `<circle cx="${x}" cy="${y}" r="${r}"${f ? ' class="f"' : ''}/>`;
const p = (d, f) => `<path d="${d}"${f ? ' class="f"' : ''}/>`;
const el = (x, y, rx, ry, f) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${f ? ' class="f"' : ''}/>`;
const rc = (x, y, w, h, rx, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx || 0}"${f ? ' class="f"' : ''}/>`;
const RING = c(12, 12, 9.3);
const HEX = p('M12 2.3l8.4 4.85v9.7L12 21.7l-8.4-4.85v-9.7z');
const DIA = p('M12 1.6l10.4 10.4L12 22.4 1.6 12z');
const drop = (x, y, s) => p(`M${x} ${y}c${1.2 * s} ${1.5 * s} ${1.8 * s} ${2.5 * s} ${1.8 * s} ${3.3 * s}a${1.8 * s} ${1.8 * s} 0 01${-3.6 * s} 0c0${-.8 * s} ${.6 * s}${-1.8 * s} ${1.8 * s}${-3.3 * s}z`);

const TOKS = [], TKB = {};
function tk(id, cls, tag, col, svg, extra) {
  const o = Object.assign({ id, cls, tag, col, svg }, extra || {});
  TOKS.push(o); TKB[id] = o; return o;
}
/* ---- continuous number literals: token id '#<value>' (6 decimal places, ±999999.999999) ---- */
const NUM_MAX = 999999.999999;
function fmtNum(v) {
  if (!isFinite(v)) v = 0;
  v = clamp(v, -NUM_MAX, NUM_MAX);
  let s = (Math.round(v * 1e6) / 1e6).toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s;
}
const numId = v => '#' + fmtNum(v);
const NUMT = new Map();
function numTok(id) {
  let o = NUMT.get(id);
  if (o) return o;
  const str = id.slice(1);
  if (!/^-?\d{1,6}(\.\d{1,6})?$/.test(str)) return undefined;
  if (NUMT.size > 4000) NUMT.clear();
  o = { id, cls: 'num', tag: '', col: '#ffd98a', svg: '', v: +str };
  NUMT.set(id, o); return o;
}
const TK = new Proxy(TKB, {
  get(t, k) { return (typeof k === 'string' && k.charCodeAt(0) === 35) ? numTok(k) : t[k]; },
  has(t, k) { return (typeof k === 'string' && k.charCodeAt(0) === 35) ? !!numTok(k) : k in t; }
});
SK.fmtNum = fmtNum; SK.numId = numId; SK.NUM_MAX = NUM_MAX;
const OPC = '#8d97ad', SENC = '#8fd6ff', ACTC = '#f3f6ff', STC = '#cdbcff', REGC = '#7fffd4',
  NUMC = '#ffd98a', HORC = '#f0c674', IGC = '#7ef0c2', CMPC = '#b7c3d9';

/* ---- operators ---- */
tk('GT', 'cmp', '', OPC, p('M7.5 5.5l9 6.5-9 6.5'));
tk('LT', 'cmp', '', OPC, p('M16.5 5.5l-9 6.5 9 6.5'));

function mkClone(S, type, rec, n0) {

/* ---------------- derived per-tick fields ---------------- */
const PW = { virus: .005, bact: .01, para: .002, part: .01 };
function derive(S) {
  const L = S.sl; L.length = 0;
  for (const a of S.agents) for (const s of a.strains) L.push(s);
  S.pamp.fill(0); S.agLoad.fill(0); S.partLoad.fill(0); S.paraLoad.fill(0); S.opsLoad.fill(0); S.adccLoad.fill(0); S.msLoad.fill(0); S.strLoad.fill(0);
  for (let c = 0; c < NC; c++) S.ags[c].length = 0;
  // permeability + antibody access
  for (let c = 0; c < NC; c++) {
    const sg = S.comp[c].sig;
    S.perm[c] = c < NT ? Math.min(1, (sg[sHIS] * 1.2 + sg[sTNF]) / 25) : 0;
    for (let k = 0; k < 4; k++) S.acc[k][c] = Math.min(1, ACC0[k][c] * (1 + 1.5 * S.perm[c]));
  }
  S.abl.length = 0; for (let ix = 0; ix < 1024; ix++) if (S.abv[ix] > 0.01) S.abl.push(ix); else S.abv[ix] = 0;
  S.arml.length = 0; for (let r = 0; r < 256; r++) if (S.arm[r] > 0.01) S.arml.push(r); else S.arm[r] = 0;
  for (let t = 0; t < NT; t++) S.tis[t].Itot = 0;
  for (const s of L) {
    const a = s.a, kind = a.kind;
    for (let c = 0; c < NC; c++) {
      const ld = s.load[c], inf = c < NT ? s.inf[c] : 0;
      if (ld <= 0 && inf <= 0) { s.neut[c] = 0; s.ops[c] = 0; continue; }
      let g = 0, m = 0, ia = 0;
      for (const ix of S.abl) {
        const af = AFFT[POPC[(ix >> 2) ^ s.epi]]; if (af <= 0) continue;
        const cls = ix & 3, amt = S.abv[ix] * af * S.acc[cls][c];
        if (cls === 0) m += amt; else if (cls === 1) g += amt; else if (cls === 2) ia += amt;
      }
      s.abG[c] = g; s.abM[c] = m;
      s.neut[c] = 1 - Math.exp(-0.03 * (g + 1.3 * ia + 0.4 * m));
      s.ops[c] = 1 - Math.exp(-(0.05 * S.comp[c].sig[sC3] * (1 - s.tr.cmp) + 0.04 * (g + 0.6 * m)));
      const amt = kind === 'virus' ? ld * 0.3 + inf * 2 : ld;
      S.pamp[c] += amt * PW[kind] * a.pw;
      S.ags[c].push({ epi: s.epi, amt, s });
      S.agLoad[c] += amt;
      if (kind === 'part') S.partLoad[c] += ld; else if (kind === 'para') S.paraLoad[c] += ld;
      S.opsLoad[c] += (kind === 'virus' ? ld * 0.3 : ld) * s.ops[c];
      if (c < NT && inf > 0) {
        const ts = S.tis[c]; ts.Itot += inf;
        const mh = ts.mhcI * (1 - 0.85 * s.tr.mhd);
        S.msLoad[c] += inf * (1 - mh) * 0.6; S.strLoad[c] += inf * 0.5; S.adccLoad[c] += inf * (1 - Math.exp(-0.04 * g));
      }
    }
  }
  for (const tu of S.tumors) {
    if (tu.n <= 0) continue; const c = tu.c;
    S.ags[c].push({ epi: tu.epi, amt: tu.n * 0.12, tu });
    S.agLoad[c] += tu.n * 0.12; S.msLoad[c] += tu.n * (1 - tu.mhc) * 0.6; S.strLoad[c] += tu.n * 0.45;
    const cf = CIRC[c];
    if (cf > 0) { const m = tu.n * cf; S.ags[BLOOD].push({ epi: tu.epi, amt: m * 0.12, tu, cf }); S.agLoad[BLOOD] += m * 0.12; S.msLoad[BLOOD] += m * (1 - tu.mhc) * 0.6; S.strLoad[BLOOD] += m * 0.45; }
  }
  for (let t = 0; t < NT; t++) {
    const ts = S.tis[t];
    if (ts.debris > 20) { S.ags[t].push({ epi: ts.self, amt: (ts.debris - 20) * 0.3, self: true }); S.agLoad[t] += ts.debris * 0.1; }
    S.strLoad[t] += ts.H * ts.dmg * 0.0006; S.msLoad[t] += ts.H * (1 - ts.mhcH) * (1 - ts.mhcH) * 0.003;
  }
  S.toxc.fill(0); for (const x of S.toxins) for (let c = 0; c < NC; c++) S.toxc[c] += toxConc(S, x, c);
  S.pamp[NODE] = (S.pamp[LUNG] + S.pamp[GUT] + S.pamp[LIVER] + S.pamp[BRAIN]) * 0.3 + S.pamp[BLOOD] * 0.3;
  S.igx.fill(0);
  if (S.arml.length) for (let t = 0; t < 2; t++) {
    let x = 0;
    for (const ag of S.ags[t]) { if (ag.tu || ag.self) continue; let b = 0; for (const r of S.arml) b += S.arm[r] * AFFT[POPC[r ^ ag.epi]]; x += ag.amt * b; }
    S.igx[t] = x * 0.01;
  }
  for (let c = 0; c < NC; c++) S.dcTot[c] = popTot(S, 'DC', c);
  // per-clone antigen + help levels
  const KP = S.KP;
  for (const cl of S.clones.TH) {
    cl.tot = cloneTot(cl); const r = cl.rec; cl.agv.fill(0);
    let x = 0; for (const e of KP.p2l) x += KP.p2[e] * AFFT[POPC[e ^ r]]; cl.agv[NODE] = x;
    for (let t = 0; t < NT; t++) { let y = 0; for (const ag of S.ags[t]) y += ag.amt * AFFT[POPC[ag.epi ^ r]]; cl.agv[t] = Math.min(1, KP.pl[t] / 8) * y * 0.04; }
  }
  for (const cl of S.clones.TC) {
    cl.tot = cloneTot(cl); const r = cl.rec; cl.agv.fill(0);
    let x = 0; for (const e of KP.p1l) x += KP.p1[e] * AFFT[POPC[e ^ r]];
    let yn = 0; for (const ag of S.ags[NODE]) if (ag.tu) { const af = AFFT[POPC[ag.epi ^ r]]; if (af > 0) yn += ag.tu.n * af * ag.tu.mhc; }
    cl.agv[NODE] = x + yn * 0.3;
    let yb = 0; for (const ag of S.ags[BLOOD]) if (ag.tu) { const af = AFFT[POPC[ag.epi ^ r]]; if (af > 0) yb += ag.tu.n * ag.cf * af * ag.tu.mhc; }
    cl.agv[BLOOD] = yb * 0.3;
    for (let t = 0; t < NT; t++) {
      const ts = S.tis[t]; let y = 0;
      for (const ag of S.ags[t]) {
        const af = AFFT[POPC[ag.epi ^ r]]; if (af <= 0) continue;
        if (ag.s) y += ag.s.inf[t] * af * ts.mhcI * (1 - 0.85 * ag.s.tr.mhd);
        else if (ag.tu) y += ag.tu.n * af * ag.tu.mhc;
      }
      const sa = SAFF[POPC[ts.self ^ r]]; if (sa > 0) y += ts.H * sa * ts.mhcH * 0.05;
      cl.agv[t] = y * 0.3;
    }
    for (let c = 0; c < NC; c++) { let h = 0; for (const hp of KP.help[c]) h += hp.amt * AFF2[POPC[hp.rec ^ r]]; cl.hlv[c] = h; }
  }
  for (const cl of S.clones.BC) {
    cl.tot = cloneTot(cl); const r = cl.rec; cl.agv.fill(0);
    let x = 0, best = 0, bestE = -1;
    for (const e of S.nagl) { const af = AFFT[POPC[e ^ r]]; const v = S.nag[e] * af; x += v; if (v > best) { best = v; bestE = e; } }
    cl.agv[NODE] = x * 0.5; cl.tgt = bestE;
    if (bestE >= 0) cl.aff = AFFT[POPC[bestE ^ r]];
    let h = 0; for (const hp of KP.help[NODE]) h += hp.amt * AFF2[POPC[hp.rec ^ r]]; cl.hlv.fill(0); cl.hlv[NODE] = h;
  }
}

  // septic vasoplegia mediator
  if (S.septic > 0) { bl[sTNF] += Math.min(6, S.septic); S.septic = 0; }
}

/* ---------------- whole-body physiology ---------------- */
function physSystemic(S) {
  // acute haemorrhage empties the circulation at once (whole blood at the haematocrit); refill and repair follow
  let rbcBled = 0;
  if (S.bleed > 0) {
    const bL = S.bleed * ECF0; rbcBled = Math.min(S.rbc - .05, bL * 0.42 * S.hbF / 2.0);

  const c9 = x => Math.min(9, x) * eff, cap = (x, id) => Math.min(SK.ACT_U[id].max * SK.ACT_U[id].d, x) * eff;   // natural-unit effectors keep their own ceilings

  if (S.cough > 0) { S.cost += 0.05 * S.cough; S.comp[LUNG].sec[sDAMP] += 0.01 * Math.max(0, S.cough - 4); }
  if (S.vomit > 0) { S.cost += 0.12 * S.vomit; S.lum *= 1 - Math.min(0.5, 0.05 * S.vomit); S.stats.emesis = (S.stats.emesis || 0) + S.vomit / 1.5; }
  const APP = Math.min(9, B.APP);

  S.exer = env.exer; S.exerE = 55 * S.exer;                                        // exer 1 ≈ hard labour, ≈ +385 kcal/h above rest
  for (const h of [hCORT, hADR]) {
    let tg = Math.min(9, B.hor[h]) * eff;
    if (h === hCORT) tg += env.stress * 1.5; else tg += env.stress * 1 + 0.8 * S.exer;     // small fixed reflex share; the program does the rest
    S.hor[h] += (tg - S.hor[h]) * HOR_K[h];
  }
  const CORT = S.hor[hCORT], ADR = S.hor[hADR];
  viremiaEV(S);
  // thermoregulation
  S.setp += (37 + 0.35 * Bc.FEV - S.setp) * 0.4;                                   // hypothalamic PGE2 set point moves over hours, not at once
  const metab = (1 + 0.1 * (S.temp - 37)) * (1 - 0.015 * Bc.RST) * (1 - 0.15 * env.rest);
  const heatM = metab + 0.22 * Bc.SHV + 0.012 * Math.max(0, S.costLast - 11) + 4.0 * S.exer;          // ≈ 80 % of work energy ends as heat
  // heat acclimatisation (days of sweating): earlier, more profuse, more dilute sweat
  S.hac = clamp((S.hac || 0) + (Bc.SWT > 4 && S.temp > 37.2 ? 0.012 : 0) - 0.003 * (S.hac || 0), 0, 1);
  const sweatEff = clamp(S.vol * 1.5 - 0.5, 0, 1) * (1 - env.hum) * (1 + 0.3 * S.hac);
  S.sweatML = 45 * Bc.SWT * sweatEff;
  // skin blood flow sets the core→skin→air conductance (≈0.3–3× of neutral); above skin temperature it carries heat in
  const skinG = Math.max(0.25, Math.exp(0.13 * Bc.VDI - 0.08 * Bc.VCO));
  const loss = 0.0667 * (S.temp - env.tamb) * skinG + 0.28 * Bc.SWT * sweatEff;
  S.temp = clamp(S.temp + 0.22 * (heatM - loss), 20, 45);

  if (S.temp > 40.2 && S.exer > 0) { const r = (S.temp - 40.2) * S.exer; S.kRel += 18 * r; S.pig += 0.3 * r; }   // exertional rhabdomyolysis
  // capillary leak (TNF, histamine) shifts plasma out of the circulation

  // heart → cardiac output × SVR → MAP
  physHeart(S, Bc);
  if (S.bp > 135) { const br = S.tis[BRAIN], k = br.H * (S.bp - 135) * 4e-5; br.necX += k; br.kills.hyp += k; }
  // gas exchange
  const lung = S.tis[LUNG];
  const bronch = Math.max(0, 0.5 * Math.min(1, S.comp[LUNG].sig[sHIS] / 25) * (1 - 0.08 * ADR));
  lung.fn = clamp(lung.H / lung.H0, 0, 1) * (1 - .55 * lung.edema) * (1 - .3 * lung.muc) * (1 - bronch) * (1 - .5 * Math.min(1, lung.tum / (0.8 * lung.H0)));
  S.vnt += (Bc.VNT - S.vnt) * 0.3;
  S.sat = 100 * (1 - Math.exp(-3.2 * env.amb * lung.fn * (1 + 0.11 * S.vnt)));
  const visc = S.hbF > 1.3 ? Math.max(.5, 1 - (S.hbF - 1.3) * 0.8) : 1;
  // anaemia is buffered by a higher cardiac output and O2 extraction (delivery ∝ Hb^0.6); the heart cannot extract more
  const rbcE = S.hbF < 1 ? Math.pow(Math.max(0.01, S.hbF), 0.6) : Math.min(1.1, S.hbF);
  S.cao2 = S.sat * Math.min(1.1, S.hbF) * visc;
  S.oxyBase = S.sat * rbcE * visc;
  S.oxy = S.oxyBase * Math.min(1, S.perf);
  const rbc0 = S.rbc;
  S.rbc = Math.max(.05, S.rbc - S.rbc * 0.002);
  // meals: carbohydrate/fat/protein to the lumen, plus water, Na+, K+
  const hr = S.t % 24;
  S.mealW = S.mealNa = S.mealK = 0;
  if ((hr === 1 || hr === 6 || hr === 12) && env.food > 0 && APP > 0) {
    const meal = 100 * env.food * APP / 7, q = meal / 90; S.lum += meal;
    S.mealW = 330 * q * (1 - 0.5 * env.dry); S.mealNa = 45 * q; S.mealK = 25 * q;
  }

  // kidney: filtration, tubular transport, RAAS, EPO → water / Na+ / K+ / base balance
  physRenal(S, Bc, metab);
  // gut absorption
  const gut = S.tis[GUT];
  const ABS = Math.min(9, gut.it[0].ABS || 0);
  const ab = Math.min(S.lum * 0.25, gut.H * ABS * 1.0e-3 * (1 - .5 * gut.muc) * (1 - S.steal) * (1 - .4 * gut.edema));
  S.lum = (S.lum - ab) * 0.97; S.cost += gut.H * ABS * 1.5e-5 * (ab > 0 ? 1 : .2);
  S.absLast = ab;
  // glucose ↔ islets, liver, muscle, adipose; renal glycosuria (10-minute substeps)
  physGlucose(S, Bc, metab, ab);
  // lactate, pCO2, HCO3-, pH, K+ shifts, Na+, osmolality
  physMilieu(S, Bc, metab);
  const liv = S.tis[LIVER], Lf = clamp(liv.H / liv.H0, 0, 1) * (1 - .5 * Math.min(1, liv.tum / (0.8 * liv.H0)));
  S.nh3 += 0.1 * metab - S.nh3 * 0.25 * Lf;
  S.gsh = clamp(S.gsh + (0.004 + Lf * Math.min(9, liv.it[0].AOX || 0) * 0.008) * (1 - S.gsh), 0, 1);
  // brain
  const br = S.tis[BRAIN], n0 = br.it[0], ni = k => Math.min(9, n0[k] || 0), bsg = S.comp[BRAIN].sig;
  const act = ni('FIR') / 5, INH = ni('INH'), HSP = ni('HSP');
  const gluE = S.glu + 45 * Math.min(1, S.ket / 20);
  const fuelB = clamp((gluE - 28) / 30, 0, 1);
  const oxB = clamp((S.oxyBase * Math.min(1, S.bp / 58) * (1 - .35 * br.edema) - 36) / 34, 0, 1);
  const sup = Math.min(fuelB, oxB);
  if (act > sup * 1.3 + 0.05) S.glt += (act - sup * 1.3) * 0.5;
  if (S.temp > 40.2) S.glt += (S.temp - 40.2) * 0.4;
  S.glt = clamp(S.glt * (1 - 0.15 - 0.08 * INH), 0, 12);
  if (S.glt > 1) { const k = br.H * (S.glt - 1) * 0.0012 * (1 - 0.05 * HSP); br.necX += k; br.kills.exc += k; }
  if (sup < 0.6) { const k = br.H * (0.6 - sup) * (0.6 - sup) * 0.012; br.necX += k; br.kills.hyp += k; }
  S.plas = clamp(S.plas + ni('PLA') * 0.0005 * (1.4 - S.plas) - 0.0006 * (S.plas - 1), 1, 1.4);
  const st = clamp(br.H / br.H0 * S.plas, 0, 1) * (1 - .4 * Math.min(1, br.tum / (0.5 * br.H0)));
  const af = act <= 1 ? act : 1 + (act - 1) * 0.25;

  const toxB = 1 / (1 + S.toxNeuro * 0.08 + Math.max(0, S.nh3 - 1.2) * 0.5);
  const infB = Math.max(0, 1 - Math.min(.5, 0.012 * (bsg[sTNF] + bsg[sIL6] * .5) + 0.004 * bl[sTNF]) - 0.3 * br.edema);
  // milieu: dysnatraemia (cerebral oedema / shrinkage), acidaemia, uraemia, CO2 narcosis

  const co2B = S.pco2 > 65 ? clamp(1 - (S.pco2 - 65) / 45, 0, 1) : 1;

  S.sleepDebt = clamp(S.sleepDebt, 0, 1);

  S.bf.st = Math.min(1, st * af); S.bf.stS = Math.min(1, st); S.bf.act = Math.min(1, af); S.bf.sup = sup; S.bf.fuel = fuelB; S.bf.ox = oxB; S.bf.tmp = tmpB; S.bf.tox = toxB; S.bf.inf = infB; S.bf.slp = slp;
  S.bf.mil = milB; S.bf.na = naB; S.bf.ph = phB; S.bf.ure = ureB; S.bf.co2 = co2B;
  S.brainF = 100 * Math.min(1, st * af) * sup * tmpB * toxB * infB * slp * milB;
  br.fn = S.brainF / 100;
  S.bodyEff = clamp(S.brainF / 60, .35, 1);
  if (S.brainF < S.stats.minBrain) S.stats.minBrain = S.brainF;
  S.bbb = clamp(0.04 + (1 - br.tj) * 0.25 + bsg[sTNF] / 40 + bl[sTNF] / 80 + (S.temp > 40 ? .15 : 0) + br.edema * .2, .04, 1);
  // modifiers for the next tick
  S.immMod = Math.max(.2, (1 - 0.045 * CORT) * (1 + 0.06 * clamp(S.temp - 37, 0, 3)) * (S.temp < 35 ? .7 : 1) * (S.oxy < 70 ? .8 : 1) * (1 - 0.3 * S.sleepDebt));
  S.neuMod = S.glu > 180 ? .7 : 1;
  S.mastStab = 1 / (1 + 0.15 * ADR + 0.08 * CORT);

  S.sen = clamp((S.t - 3600) / 9600, 0, 1.5); S.age = S.sen;
  S.ageF = 0.35 + 0.65 * Math.min(1, S.t / 3600) + 1.5 * S.sen;           // somatic mutation load → cancer incidence (low in youth)
  S.thy = Math.max(.3, 1 - 0.5 * S.sen) * (1 - 0.05 * CORT);               // thymic involution
  if (S.sen > 0) { S.kid.nm = Math.max(0.3, S.kid.nm - 0.000025 * S.sen); S.immMod *= 1 - 0.25 * Math.min(1, S.sen); }   // nephron dropout · immunosenescence
  S.fuelF = clamp((S.glu - 30) / 35, 0.1, 1) * clamp((S.oxy - 35) / 40, 0.2, 1);
  S.hemo = Math.max(0, rbc0 - S.rbc - S.rbc * 0.002);
  S.bleed = 0;
}

/* ============================================================
   SOMA//KERNEL — sim E : organ physiology
   · islets of Langerhans — beta / alpha / delta cells at organelle level
     (GLUT2 → glucokinase → mitochondrial ATP:ADP → K-ATP → depolarisation → L-type Ca2+
      → first-phase fusion of docked granules → ATP/cAMP-dependent priming from the reserve pool;
      rough-ER proinsulin synthesis, PC1/3 · PC2 maturation, ER stress / UPR / CHOP apoptosis)
   · nephron — glomerulus (autoregulation, afferent/efferent tone), proximal tubule (SGLT2, NHE3,
     ammoniagenesis), loop of Henle (NKCC2), collecting duct (AQP2, ENaC, ROMK, H+-ATPase),
     juxtaglomerular apparatus / interstitium (renin, EPO); acute tubular injury
   · heart — SA node, atria / AV node, ventricle: rate, rhythm, Frank–Starling, afterload,
     myocardial O2 balance, myocarditis
   · water · Na+ · K+ · acid–base (Henderson–Hasselbalch), lactate, osmolality
   · glucose ↔ insulin / glucagon coupling in six 10-minute substeps per hour
   (fragment — same closure as sim A–D)
   ============================================================ */
const hAVP = 5, hALD = 6, hANG = 7, hREN = 8, hANP = 9, hGLP = 10, hSST = 11, NHOR = 12;
const W0 = 42, NAE0 = 1960, OSMI = 3920, KE0 = 3500, ECF0 = W0 * NAE0 / (NAE0 + OSMI);  // L · mmol · mOsm · mmol · L
const SUB = 6, DT = 1 / SUB;            // glucose–hormone substeps per hour
const KSEC = 27;                        // µU/mL systemic insulin per granule-unit/h (after ~50 % hepatic first pass)
const GDV = 112;                        // glucose distribution volume, dL
const MGCAP = 230;                      // muscle glycogen capacity (energy units ≈ 400 g)
const VNT_REF = 0;                      // resting ventilatory drive of the default axis program
const GLY_E = 0.05;                     // game energy scale: urinary glucose drains the blood-glucose energy pool in proportion to its real caloric share

function initOrgans(S) {
  S.og = {
    CAR: { n: [1000, 1000, 1000], it: [{}, {}, {}] },
    NEP: { n: [1000, 1000, 1000, 1000, 1000], it: [{}, {}, {}, {}, {}] },

  S.isl = {
    bm: 1, am: 1, dm: 1, gkA: 1, mito: 1, ros: 0.08, inf: 0, vir: 0, ach: 0.25, aa: 0,
    J: 0.3, atp: 2.5, katp: 0.66, ca: 0.01, camp: 0.35,
    rrp: 0.78, res: 20, pri: 3, chap: 1, erLoad: 1, ers: 2.4, perk: 0,
    aAtp: 2.2, aKatp: 0.6, aCa: 0.07, aRrp: 0.8, aRes: 20, aPri: 2,
    dAtp: 2.6, dKatp: 0.55, dCa: 0.15, dRrp: 0.7, dRes: 10, dPri: 1,
    sstL: 0.3, cpep: 1.2, secB: 0.26, secA: 0.27, secD: 0.55, prox: 12
  };
  S.ins = 7; S.insP = 17; S.insX = 0.9; S.gcg = 70; S.gcgP = 97; S.glp1 = 2.5; S.isens = 1; S.ffa = 0.4;
  S.mgly = 200; S.exer = 0; S.exerE = 0; S.vEV = 0; S.pig = 0; S.kRel = 0; S.sweatML = 0;
  S.mealW = 0; S.mealNa = 0; S.mealK = 0; S.leak = 0; S.pvF = 1; S.bvF = 1; S.hbF = 1;
  S.lyte = { W: W0, NaE: NAE0, KE: KE0, hco3b: 24 };
  S.na = 140; S.naM = 140; S.k = 4.2; S.hco3 = 24; S.pH = 7.40; S.pco2 = 40; S.lac = 1; S.osm = 287; S.ketM = 0; S.ve = 6; S.rr = 14; S.vt = 430;
  S.kid = { nm: 1, aki: 0, ntx: 0, gfr: 120, rbf: 1100, uo: 70, fena: 0.006, naU: 6, kU: 3, nae: 2.9, gluU: 0, tm: 18000, nac: 1,
            ren: 0.85, ang: 11, ald: 6, avp: 2.3, epo: 8.4, bun: 14, cr: 1 };
  S.cv = { hr: 71, sv: 70, co: 5, svr: 17.75, rhy: 0, vag: 0.85, caT: 1, dmg: 0, myo: 0, isch: 0, o2b: 1.2, anp: 22, rhyT: 0 };
  S.hor = [1, 0, 0.9, 2, 0, 2.1, 1.5, 1.4, 1.3, 0.9, 0.8, 1.5];

}

/* ---------- sensor scales shared by the new organ readouts ---------- */
/* general (any dialect) physical readings of the milieu; undefined → not handled here */
const cvpOf = S => clamp(6 + 30 * ((S.bvF || 1) - 1), 0, 30);                  // central venous pressure, mmHg (blood volume)
function senseMilieu(S, id) {
  switch (id) {
    case 'NA': return S.naM;
    case 'K': return S.k;
    case 'PH': return S.pH;
    case 'HCO': return S.hco3;
    case 'CO2': return S.pco2;
    case 'OSM': return S.osm;
    case 'LAC': return S.lac;
    case 'FFA': return S.ffa;
    case 'URE': return S.kid.bun;
    case 'GFR': return S.kid.gfr;
    case 'NAC': return 35 * S.kid.nac;
    case 'HR': return S.cv.hr;
    case 'RHY': return S.cv.rhy;
    case 'PRE': return cvpOf(S);
    case 'ACH': return 20 * S.cv.vag;
  }
  return undefined;
}
SK.cvpOf = cvpOf;

/* organ-program sensors: what a beta cell, a collecting-duct cell or a ventricular myocyte reads */
function senseOrgan(S, e, id) {
  const st = e.st, bl = S.comp[BLOOD].sig;
  if (e.type === 'ISL') {
    const I = S.isl;
    switch (id) {
      case 'ATP': return st === 1 ? I.aAtp : st === 2 ? I.dAtp : I.atp;                       // ATP:ADP ratio
      case 'KAT': return 100 * (st === 1 ? I.aKatp : st === 2 ? I.dKatp : I.katp);           // K-ATP open probability %
      case 'CA': return 100 + 500 * Math.min(1, st === 1 ? I.aCa : st === 2 ? I.dCa : I.ca); // cytosolic Ca2+ nmol/L
      case 'CMP': return I.camp;                                                             // cAMP µmol/L
      case 'ACH': return 20 * I.ach;
      case 'INS': return S.insP;                                                             // intra-islet ≈ portal insulin
      case 'GCG': return S.gcgP;
      case 'RRP': return 100 * (st === 1 ? I.aRrp : st === 2 ? I.dRrp : I.rrp);              // docked granules per cell
      case 'RES': return 500 * (st === 1 ? I.aRes : st === 2 ? I.dRes : I.res);              // reserve granules per cell
      case 'PRI': return 100 * (st === 1 ? I.aPri / 2 : st === 2 ? I.dPri : I.erLoad);       // ER client load % of capacity
      case 'ERS': return clamp(I.ers / 9 * 100 * (st === 1 ? 0.4 : st === 2 ? 0.6 : 1), 0, 100);   // IRE1/PERK activation %
      case 'ROS': return 10 * I.ros;
      case 'TNF': return (bl[sTNF] + 25 * I.inf) * SIG_U[sTNF];
      case 'IFNG': return (bl[sIFNG] + 15 * I.inf) * SIG_U[sIFNG];
      case 'VRNA': return st === 0 ? Math.log10(1 + I.vir * 1e7) : 0;
      case 'DMG': return 100 * clamp(1 - (st === 1 ? I.am : st === 2 ? I.dm : I.bm), 0, 1);
      case 'DENS': return 100 * (st === 1 ? I.am : st === 2 ? I.dm : I.bm);
    }
    return undefined;
  }
  if (e.type === 'NEP') {
    const kd = S.kid;
    switch (id) {
      case 'O2': return ptO2(S.oxy * (st === 2 || st === 3 ? 0.78 : 1) * (1 - 0.4 * kd.aki));   // the medulla runs hypoxic
      case 'DMG': return 100 * clamp(kd.aki * (st === 1 ? 1.15 : st === 4 ? 0.5 : st === 0 ? 0.7 : 0.9), 0, 1);
      case 'DENS': return 100 * kd.nm;
      case 'TOX': return (S.toxc[BLOOD] + kd.ntx * 3) * 0.5;
    }
    return undefined;
  }
  if (e.type === 'CAR') {
    const cv = S.cv;
    switch (id) {
      case 'CA': return 1000 * cv.caT;                                                       // systolic Ca2+ transient nmol/L
      case 'O2': return 25 * cv.o2b;                                                         // myocardial PO2-equivalent mmHg
      case 'ATP': return Math.max(0.5, 8 * Math.min(1.6, cv.o2b) * (1 - cv.dmg));            // PCr/ATP-like energy ratio
      case 'DMG': return 100 * Math.min(1, cv.dmg + 0.5 * cv.myo);
      case 'DENS': return 100 * (1 - cv.dmg);
    }
    return undefined;
  }
  return undefined;
}

/* ---------- program drives (acts summed over rules, read once per hour) ---------- */
function drives(S, type) {
  const it = S.og[type].it;
  return (st, k) => Math.min(9, it[st][k] || 0);
}

/* ============================================================
   ISLETS OF LANGERHANS
   ============================================================ */
function isletSub(S, G, g) {
  const I = S.isl, adr = S.hor[hADR], sst = I.sstL;
  // ---- beta cell: glucokinase is the glucose sensor (S0.5 ≈ 8 mM, Hill 1.7)
  const gH = Math.pow(G / 144, 1.7), fl = gH / (1 + gH);
  I.J = I.gkA * fl;
  I.atp = 1 + 5 * I.J * I.mito * (1 - 0.35 * I.ros);                              // mitochondrial ATP:ADP

  // ---- acute tubular injury (ischaemia, nephrotoxins, sepsis, haem pigment) and regeneration
  const isch = Math.max(0, 65 - map) / 25;
  const hit = 0.006 * isch * isch + 0.002 * S.toxc[BLOOD] + 0.004 * kd.ntx + 0.002 * Math.min(1, bl[sTNF] / 60) + 0.004 * S.pig;
  // programmed apoptosis of injured tubular cells: removes them before they necrose (faster, quieter recovery), but
  // deletes healthy epithelium when there is little injury to clear
  const apoF = Math.min(1, APO / 9);
  kd.aki = clamp(kd.aki + hit * (1 - 0.05 * AOX) - (0.012 * (PRO / 5) * (isch < 0.2 ? 1 : 0.2) + 0.002 + 0.01 * apoF) * kd.aki, 0, 1);
  if (kd.aki > 0.7) kd.nm = Math.max(0.2, kd.nm - 0.0004 * (kd.aki - 0.7) * (1 - 0.5 * apoF));   // cortical necrosis
  if (apoF > 0) { kd.nm = Math.max(0.2, kd.nm - 0.00012 * apoF * (1 - kd.aki)); S.cost += 0.01 * APO; }
  kd.ntx = Math.max(0, kd.ntx * (1 - 0.02 - 0.03 * kd.gfr / 120));
  { const nn = 1000 * kd.nm, O = S.og.NEP.n; O[0] = nn; O[1] = nn * (1 - 0.5 * kd.aki); O[2] = nn * (1 - 0.3 * kd.aki); O[3] = nn * (1 - 0.4 * kd.aki); O[4] = nn; }
  kd.tm = 18000 * (0.4 + 0.12 * SGL) * kd.nm * (1 - 0.6 * kd.aki);                          // SGLT2 Tm, mg/h
  kd.nac = clamp(dCD * (1 - 0.15 * (NKC - 5)) / 0.19 * (kd.gfr / 118) * (S.na / 140) * Math.exp(5 * (veff - 1)), 0, 2);   // macula densa NaCl
  // ---- whole-body water / Na+ / K+ / base balance
  const insens = 30 * (1 + 0.12 * Math.max(0, S.temp - 37)) * (1 + 0.05 * S.vnt) * (1 - 0.3 * env.hum);
  const diar = S.diar * ECF0 * 1000, bleed = S.bleed * ECF0 * 1000, sweat = S.sweatML;
  const drink = 50 * Bc.DRK * (1 - 0.92 * env.dry);
  S.drinkML = drink;
  const vomL = 0.12 * (S.vomit || 0);                                                     // L of gastric fluid per hour
  L.W = clamp(L.W + (drink + S.mealW + 15 - kd.uo - insens - sweat - diar - bleed) / 1000 - vomL, 22, 60);
  kd.swNa = clamp(60 / (1 + 0.12 * kd.ald) * (1 - 0.4 * (S.hac || 0)), 8, 60);                                      // aldosterone acts on eccrine ducts: heat acclimatisation
  L.NaE = clamp(L.NaE + S.mealNa - kd.naU - sweat * kd.swNa / 1000 - diar * 0.1 - bleed * 0.14 - vomL * 60, 900, 3200);
  L.KE = clamp(L.KE + S.mealK - kd.kU - sweat * 0.005 - diar * 0.03 - bleed * 0.004 + S.kRel - vomL * 12, 1800, 4600);
  L.hco3b = clamp(L.hco3b + (kd.nae - 2.9 * metab - waste - bicarbU - diar * 0.04 + vomL * 90) / (ECF0 * Math.max(0.4, S.vol)), 4, 45);   // lost HCl leaves HCO3- behind
  S.vol = clamp(L.W * L.NaE / (L.NaE + OSMI) / ECF0, 0.3, 1.6);
  // plasma volume (≈3 L): whole-blood loss empties it at once; Starling refill from the interstitium follows (τ ≈ 4 h)
  // and a capillary leak holds part of it out. Blood volume = plasma + red cells; Hb concentration = red cell mass / BV
  S.pvF += (S.vol * (1 - S.leak) * (1 + 0.5 * Math.max(0, 1 - S.rbc)) - S.pvF) * 0.22;   // chronic anaemia: plasma expands to hold blood volume
  S.bvF = (3.0 * S.pvF + 2.0 * S.rbc) / 5.0;
  S.hbF = S.rbc / Math.max(0.3, S.bvF);
  S.na = (L.NaE + OSMI) / L.W;
  S.cost += 0.008 * (NHE + NKC + ENC + PMP + AMM);
}

/* ============================================================
   GLUCOSE ↔ HORMONES, six 10-minute substeps per hour
   ============================================================ */
function physGlucose(S, Bc, metab, ab) {
  const I = S.isl, g = drives(S, 'ISL'), bl = S.comp[BLOOD].sig;
  const liv = S.tis[LIVER], Lf = clamp(liv.H / liv.H0, 0, 1) * (1 - .5 * Math.min(1, liv.tum / (0.8 * liv.H0)));
  S.glyCap = 65 * Math.max(.05, Lf);                                                        // ≈ 115 g of liver glycogen
  const h0 = liv.it[0], gi = k => Math.min(9, h0[k] || 0);
  const GLS = gi('GLS'), GLR = gi('GLR'), GNG = gi('GNG'), LIP = gi('LIP'), KGN = gi('KGN');
  const CORT = S.hor[hCORT], ADR = S.hor[hADR];
  // insulin sensitivity of muscle / fat: glucocorticoids, catecholamines, inflammatory cytokines, contraction (GLUT4)
  S.isens = clamp((1 - 0.05 * CORT) * (1 - 0.035 * ADR) * (1 - 0.35 * Math.min(1, (bl[sTNF] + 0.5 * bl[sIL6]) / 50)) * (1 + 0.6 * S.exer) * (1 - 0.012 * S.env.sugar), 0.25, 1.8);
  I.ach = clamp(0.25 + 0.35 * Math.min(1, S.lum / 15) - 0.025 * Bc.HRT, 0, 1);              // vagal / cephalic phase
  I.aa = clamp(S.lum / 40, 0, 1);                                                          // amino acids
  const gut = S.tis[GUT];
  S.glp1 = 2.5 + 2.4 * Math.min(9, S.body.hor[hGLP]) * clamp(gut.H / gut.H0, 0, 1);        // L cells; DPP-4 t½ ≈ 2 min
  // fuel use (energy units / hour) — fatty acids and ketones spare glucose
  const other = 5.3 * metab + 2.0 * Bc.SHV + 0.12 * Bc.HRT + 0.06 * S.vnt + 0.03 * ADR + S.exerE;
  let cons = S.cost + other; if (S.oxy < 80) cons *= 1 + (80 - S.oxy) / 120;
  const bc = Math.min(cons, S.costBrain), nb = cons - bc;
  // starvation adaptation (days): lipolysis, hepatic ketogenesis and brain ketone transport rise while no food arrives
  S.fast = clamp((S.fast || 0) + (ab > 3 ? -0.15 * (S.fast || 0) : (1 - (S.fast || 0)) / 54), 0, 1);
  const mobH = clamp(0.9 * (S.hor[hGCG] + ADR + 0.5 * CORT) - 0.8 * S.hor[hINS] + 3.5 * S.fast, 0, 20);     // hormone-sensitive lipase (stress lipolysis can exceed basal needs)
  const mob = mobH + 30 * S.exer;                                                          // working muscle also burns intramuscular TG
  S.ffa = clamp(0.2 + 0.12 * mobH + 0.6 * S.exer, 0.05, 2.5);
  const ku = Math.min(bc * (0.15 + 0.45 * S.fast), S.ket * 0.25), kuP = Math.min(nb * 0.3, S.ket * (0.4 - 0.3 * S.fast));   // ketones: brain (≤60 % once adapted), muscle (avid early in a fast)
  const ffaU = Math.min(Math.max(0, nb * 0.8 - kuP), mob, S.fat);
  const mUseH = (S.exerE + 2.0 * Bc.SHV) * 0.45 * clamp(S.mgly / 120, 0.25, 1);   // shivering costs what it heats (≈ +20 kcal/h per level)                                          // working muscle burns its own glycogen
  // muscle lacks G6Pase: its glycogen reaches the brain only as lactate / alanine → hepatic gluconeogenesis
  // (Cori and glucose–alanine cycles), switched on by adrenaline (β2 → phosphorylase) and by hypoglycaemia
  const coriH = Lf * 2.4 * Math.min(2, ADR / 4) * clamp((110 - S.glu) / 40, 0, 1); S.coriH = 0;   // β2-adrenergic muscle glycogenolysis → lactate → liver
  let Jsum = 0, aSum = 0, dSum = 0, secSum = 0, rASum = 0, rDSum = 0, gluU = 0;
  const EB = S.eb; if (EB) { EB.n++; EB.abs += ab; EB.cons += cons; EB.prog += S.cost; }
  for (let k = 0; k < SUB; k++) {
    secSum += isletSub(S, Math.max(1, S.glu), g); Jsum += I.J; aSum += I.aCa; dSum += I.dCa; rASum += I._rA; rDSum += I._rD;
    S.glu += ab * DT / GE;
    let f;
    f = Math.min(Lf * GLS * 0.55, Math.max(0, (S.glu - 60) * GE * 0.3), Math.max(0, S.glyCap - S.gly) / 0.95) * DT; S.glu -= f / GE; S.gly += f * 0.95; if (EB) EB.gls += f * 0.05;
    f = Math.min(Lf * GLR * 0.9 * DT, S.gly); S.gly -= f; S.glu += f / GE;
    f = Math.min(Lf * GNG * 0.65 * DT, S.fat); S.fat -= f; S.glu += f * 0.75 / GE; if (EB) EB.gng += f * 0.25;
    f = Math.min(Lf * LIP * 0.8, Math.max(0, (S.glu - 80) * GE * 0.3)) * DT; S.glu -= f / GE; S.fat += f * 0.88; if (EB) EB.lip += f * 0.12;
    f = Math.min(Lf * (KGN * (0.25 + 0.06 * mobH) + 0.25 * S.ffa * (1 + 2 * S.fast) * (1 - 0.6 * Math.min(1, S.ins / 30))) * DT, S.fat); S.fat -= f; S.ket += f * 0.85; if (EB) EB.kgn += f * 0.15;   // FFA flux feeds ketogenesis (basal β-oxidation + programmed)
    if (S.gly > S.glyCap) { S.glu += (S.gly - S.glyCap) / GE * .5; if (EB) EB.over += (S.gly - S.glyCap) * 0.5; S.gly = S.glyCap; }
    // GLUT4 uptake follows remote insulin action (≈ 25 min lag) into muscle glycogen, then adipose
    S.insX += (S.ins / 8 - S.insX) * (1 - Math.exp(-2.4 * DT));
    const rd = 0.5 * S.insX * S.isens * Math.max(0, S.glu - 70) / 30 * GE * DT;
    const toM = Math.min(rd * 0.6, Math.max(0, MGCAP - S.mgly)); S.mgly += toM; S.fat += (rd - toM) * 0.9; S.glu -= rd / GE; if (EB) EB.rdf += (rd - toM) * 0.1;
    const mU = Math.min(S.mgly, mUseH * DT); S.mgly -= mU;
    const cori = Math.min(S.mgly, coriH * DT); S.mgly -= cori; S.glu += cori * 0.8 / GE; S.coriH += cori; if (EB) EB.cori += cori * 0.2;
    S.fat -= ffaU * DT; S.ket = Math.max(0, S.ket - (ku + kuP) * DT);
    S.glu -= (cons * DT - ffaU * DT - (ku + kuP) * DT - mU) / GE;
    // renal glucose: filtered load beyond SGLT2 capacity spills (with splay)
    const filt = S.kid.gfr * Math.max(0, S.glu) / 100 * 60 * DT, tm = S.kid.tm * DT;
    let exc = filt;
    if (tm > 1) { const w = 0.04 * tm, x = (filt - 0.9 * tm) / w; exc = Math.min(filt, x > 30 ? filt - 0.9 * tm : w * Math.log1p(Math.exp(x))); }   // threshold ≈ 180–200 mg/dL, narrow splay
    S.glu -= exc / GDV * GLY_E; gluU += exc; if (EB) EB.glyU += exc / GDV * GLY_E * GE;
    if (S.glu < 0) { if (EB) EB.neg -= S.glu * GE; S.glu = 0; }
  }
  if (EB) { EB.ket += S.ket * 0.02; EB.fcap += Math.max(0, S.fat - 40000); }
  S.ket *= 0.98;
  S.kid.gluU = gluU / 1000;                                                                // g/h
  I.secB = secSum / SUB; I.secA = rASum / SUB; I.secD = rDSum / SUB;
  isletTick(S, g, Jsum / SUB, aSum / SUB, dSum / SUB);
  S.costLast = cons; S.fat = Math.min(S.fat, 40000);
}

/* ============================================================
   MILIEU — lactate, pCO2, HCO3-, pH, K+ shifts, Na+, osmolality; hormone levels cells read
   ============================================================ */
function physMilieu(S, Bc, metab) {
  const L = S.lyte, kd = S.kid, bl = S.comp[BLOOD].sig, lung = S.tis[LUNG], liv = S.tis[LIVER];
  const Lf = clamp(liv.H / liv.H0, 0, 1);
  const hyp = clamp((78 - S.oxy) / 40, 0, 1.5);
  const prod = 0.9 * metab + 6 * hyp * hyp + 3 * Math.max(0, 0.8 - S.cv.co / 5.2) + 2.2 * Math.min(1, bl[sTNF] / 60) + 2.4 * S.exer + 0.04 * Bc.SHV + 0.4 * Math.max(0, S.glt - 1) + 0.05 * (S.coriH || 0);
  S.lac = clamp(S.lac + prod - S.lac * 0.9 * (0.15 + 0.85 * Lf) * Math.min(1, S.perf + 0.1), 0.3, 25);   // Cori cycle clearance
  const vco2 = metab * (1 + 0.03 * Bc.SHV) + S.exerE / 11;
  const va = (1 + 0.07 * S.vnt) / (1 + 0.07 * VNT_REF) * (1 + 5.6 * S.exer) * (1 + 0.008 * Math.max(0, S.pco2 - 45)) * (0.55 + 0.45 * lung.fn);   // only a weak involuntary floor: the body program runs the chemoreflex
  S.pco2 = clamp(40 * vco2 / va, 12, 110);
  // minute ventilation and its split into rate × tidal volume (dead space 150 mL)
  S.ve = 6 * va / (0.55 + 0.45 * lung.fn) * (1 + 0.15 * (1 - lung.fn));
  S.rr = clamp(14 * Math.pow(S.ve / 6, 0.62) * (1 + 0.6 * (1 - lung.fn)), 4, 48);
  S.vt = 1000 * S.ve / S.rr;
  S.ketM = S.ket * 0.36;
  { const il6 = S.comp[BLOOD].sig[sIL6] * SIG_U[sIL6], Lf = clamp(S.tis[LIVER].H / S.tis[LIVER].H0, 0, 1);   // CRP: hepatic acute-phase synthesis, t½ ≈ 19 h
    S.crp = Math.max(0, (S.crp || 0.8) + 0.245 * Math.pow(Math.max(0, il6 - 4), 0.9) * Lf + 0.03 - 0.036 * (S.crp || 0.8)); }                                                                   // β-hydroxybutyrate, mmol/L
  S.hco3 = clamp(L.hco3b - Math.max(0, S.lac - 1) - Math.max(0, S.ketM - 0.3), 2, 45);     // anion-gap acids consume HCO3-
  S.pH = 6.1 + Math.log10(S.hco3 / (0.03 * S.pco2));
  const dKE = L.KE - KE0;                                                                  // deficits are buffered by the intracellular pool (≈ −1 mmol/L per 300 mmol), excess is not
  S.k = clamp(4.2 + (dKE > 0 ? dKE / 150 : dKE / 300) + 3.5 * (7.40 - S.pH) - 0.15 * (Math.log2(1 + S.ins / 10) - 0.766)
    - 0.06 * Math.max(0, S.hor[hADR] - 1) + 0.04 * Math.max(0, S.osm - 300), 1.5, 9.5);
  S.naM = S.na - 1.6 * Math.max(0, S.glu - 100) / 100;                                     // translocational
  S.osm = 2 * S.naM + S.glu / 18 + kd.bun / 2.8;
  S.kRel = 0; S.pig *= 0.9;
  // hormone levels on the 0–9 scales every dialect reads
  S.hor[hINS] = clamp(S.ins / 8, 0, 9);
  S.hor[hGCG] = clamp((S.gcg - 30) / 20, 0, 9);
  S.hor[hEPO] = clamp(Math.log2(Math.max(1, kd.epo / 10)) * 2.2, 0, 9);
  S.hor[hAVP] = clamp(kd.avp * 0.9, 0, 9);
  S.hor[hALD] = clamp(kd.ald / 4, 0, 9);
  S.hor[hANG] = clamp(kd.ang / 8, 0, 9);
  S.hor[hREN] = clamp(kd.ren * 1.5, 0, 9);
  S.hor[hANP] = clamp(S.cv.anp / 25, 0, 9);
  S.hor[hGLP] = clamp(S.glp1 / 3, 0, 9);
  S.hor[hSST] = clamp(S.isl.sstL * 5, 0, 9);
}

/* enterovirus load in blood (islet and myocardial tropism) */

  let v = 0;
  for (const a of S.agents) if (a.lin === 'EV') for (const s of a.strains) v += s.load[BLOOD];
  S.vEV = v;
}

function buildSprite() {
  let s = '<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>';
  for (const t of SK.TOKS) {
    const body = t.svg.replace(/class="f"/g, 'fill="currentColor" stroke="none"')
      .replace(/class="d"/g, 'fill="currentColor" stroke="none" font-size="17" font-weight="600" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace"');
    s += `<symbol id="g-${t.id}" viewBox="0 0 24 24">${body}</symbol>`;
  }
  for (const k in PI) s += `<symbol id="p-${k}" viewBox="0 0 24 24">${PI[k]}</symbol>`;
  s += '</defs></svg>';
  const d = document.createElement('div'); d.innerHTML = s; document.body.appendChild(d.firstChild);
}

  let s = `<svg class="sig" viewBox="0 0 24 24" style="color:${col || '#ff8fbd'}"><circle cx="12" cy="12" r="2.200" fill="currentColor"/>`;
  for (let i = 0; i < 8; i++) {

    s += `<path d="M${(12 + 9 * Math.cos(a0)).toFixed(2)} ${(12 + 9 * Math.sin(a0)).toFixed(2)}A9 9 0 0 1 ${(12 + 9 * Math.cos(a1)).toFixed(2)} ${(12 + 9 * Math.sin(a1)).toFixed(2)}" fill="none" stroke="currentColor" stroke-width="${on ? 3.200 : 1}" opacity="${on ? 1 : .28}"/>`;
  }
  return s + '</svg>';
}

function plot(cv, hist, series) {

    hideOv(); if (!UI.started) { UI.started = true; auInit(); setTimeout(() => sfx('boot'), 30); } else setSpeed(was);
  };
}
function gameOver() {
  const S = UI.S, o = S.over, st = S.stats; if (UI.overShown) return; UI.overShown = true; sfx('over');
  if (o.score > UI.best) { UI.best = o.score; store.set('sk_best', UI.best); }
  showOv(`<div class="card"><div class="sub" style="margin:0">system halt · day ${Math.floor(S.t / 24) + 1}</div><h1 style="font-size:19px">${o.why === 'ENERGY' ? 'ENERGY DEPLETED' : 'BRAIN FAILURE'}</h1>
<div class="cause">${esc(CAUSE[o.cause] || o.cause)}</div><div class="big">${o.score}</div>
<div class="grid2"><div><em>days</em><b>${(S.t / 24).toFixed(1)}</b></div><div><em>phases</em><b>${st.phases}</b></div><div><em>best</em><b>${UI.best}</b></div>
<div><em>eradicated</em><b>${st.cleared}</b></div><div><em>tumours</em><b>${st.tumorsKilled}/${st.tumorsBorn}</b></div><div><em>variants</em><b>${st.variants}</b></div>
<div><em>commits</em><b>${st.commits}</b></div><div><em>edit kcal</em><b>${fmt(st.editE * SK.KCAL)}</b></div><div><em>mutations</em><b>${st.muts}</b></div></div>
<canvas id="ovCh"></canvas><div class="seedrow"><span>seed ${S.seed.toString(16)}</span><span style="margin-left:auto">peak ${st.peakT.toFixed(1)}°C</span></div>
<button class="btn ghost" id="ovLog">EXPORT CASE RECORD · HTML</button><div class="seedrow" id="ovLogAlt" style="display:none"><button class="btn ghost" id="ovShare" style="flex:1">SAVE AGAIN / SHARE</button></div>
<button class="btn" id="ovGo">REBOOT</button></div>`);
  plot($('#ovCh'), S.hist, CH[0][1]);
  $('#ovLog').onclick = e => exportRecord(e.currentTarget);
  $('#ovShare').onclick = () => shareRecord();
  $('#ovGo').onclick = () => { hideOv(); newRun(); UI.started = true; sfx('boot'); };
}

/* ---------- run control ---------- */
function newRun() {
  const seed = ((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  UI.S = SK.newGame(seed); UI.wall0 = Date.now(); UI.started = false; UI.overShown = false; UI.acc = 0; UI.memT = 0; UI.warn = {}; OD.k = null;
  ED.draft = {}; ED.costs = {}; ED.undoBy = {}; ED.sel = { li: 0, ti: -1 }; ED.inspH = null; UI.detH = null;
  for (const ty of TYPES) syncDraft(ty);
  BD.parts.length = 0; $('#phc').dataset.k = ''; $('#scope').innerHTML = '';
  updHUD(); updOrgans(); renderDetail(true);
  if (UI.view === 'code') renderEditor(true); else if (UI.view === 'codex') renderCodex();
  setSpeed(1);
}
function afterTicks() {
  const S = UI.S;
  pumpEvents(); updHUD(); updOrgans(); renderDetail(); tickEditor();
  if (UI.view === 'scope') renderScope();
  if (S.over) gameOver();
}
function frame(now) {
  requestAnimationFrame(frame);
  const S = UI.S; if (!S) return;
  const dt = Math.min(250, now - (UI.last || now)); UI.last = now;
  if (UI.started && !S.over && UI.speed > 0 && !document.hidden) {
    UI.acc += dt * SPEEDS[UI.speed] / 1000;
    let n = 0;
    while (UI.acc >= 1 && n < 10) { SK.tick(S); UI.acc -= 1; n++; if (S.over) break; }
    if (UI.acc > 3) UI.acc = 0;
    if (n) afterTicks();
  }
  if (S.over && !UI.overShown) afterTicks();
  if (UI.wide || UI.view === 'soma') { drawBody(now); if (UI.selC === 'CAR') drawECG(now); }
  if (UI.view === 'icu') drawICU(now);
  auTick(S);
}
function onKey(e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if ($('#ov').classList.contains('on')) {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); const b = $('#ov .btn'); if (b) b.click(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); setSpeed(UI.speed ? 0 : (UI.prevSpeed || 1)); return; }
  if (k >= '1' && k <= '3' && UI.view !== 'code') { UI.prevSpeed = +k; setSpeed(+k); return; }
  if (UI.view !== 'code') return;
  const d = ED.draft[ED.type], s = ED.sel; if (!d) return;
  const sl = d[s.li], st = sl && s.ti >= 0 ? sl.toks[s.ti] : null, onNum = !!st && TK[st].cls === 'num';
  if (k === 'Backspace') { e.preventDefault(); if (onNum && ED.nb) numKey('⌫'); else tool('del'); }
  else if (k === 'Enter') { e.preventDefault(); tool('nl'); }
  else if (k === 'ArrowLeft') { s.ti = Math.max(-1, s.ti - 1); renderCode(); renderInsp(); }
  else if (k === 'ArrowRight') { s.ti = Math.min(d[s.li].toks.length - 1, s.ti + 1); renderCode(); renderInsp(); }
  else if (k === 'ArrowUp') { e.preventDefault(); s.li = Math.max(0, s.li - 1); s.ti = Math.min(s.ti, d[s.li].toks.length - 1); renderCode(); renderInsp(); }
  else if (k === 'ArrowDown') { e.preventDefault(); s.li = Math.min(d.length - 1, s.li + 1); s.ti = Math.min(s.ti, d[s.li].toks.length - 1); renderCode(); renderInsp(); }
  else if ((k >= '0' && k <= '9') || k === '.') numKey(k);
  else if (k === '-' && onNum && ED.nb && !ED.nb.buf) numKey('±');
  else if (KEY_TOK[k] && !e.ctrlKey && !e.metaKey) typeTok(KEY_TOK[k]);
  else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); tool('undo'); }
}
const KEY_TOK = { '+': 'ADD', '-': 'SUB', '*': 'MUL', '/': 'DIV', '<': 'LT', '>': 'GT', '=': 'EQ', '(': 'LP', ')': 'RP', '&': 'AND', '|': 'OR', '!': 'NOT' };
function init() {
  buildSprite(); buildHUD(); buildSoma(); buildEditor();
  UI.wide = window.matchMedia('(min-width: 980px)').matches; document.body.classList.toggle('wide', UI.wide);
  newRun();
  setView(UI.wide ? 'code' : 'soma');
  resizeBody(); showTitle();
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__SOMA = { UI, ED, SK, AU, SFX, sfx, exportLog: () => exportRecord(null), buildRecordHTML };

})();

</script>
