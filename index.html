    const body = t.svg.replace(/class="f"/g, 'fill="currentColor" stroke="none"')
      .replace(/class="d"/g, 'fill="currentColor" stroke="none" font-size="17" font-weight="600" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace"');
    s += `<symbol id="g-${t.id}" viewBox="0 0 24 24">${body}</symbol>`;
  }
  for (const k in PI) s += `<symbol id="p-${k}" viewBox="0 0 24 24">${PI[k]}</symbol>`;
  s += '</defs></svg>';
  const d = document.createElement('div'); d.innerHTML = s; document.body.appendChild(d.firstChild);
}

  for (let i = 0; i < 8; i++) {

}

  if (run && E.q.length < 80 && Math.random() < clamp(P.spF, 0.1, 2) * dt * 12) E.q.push({ x: 6, y: 18 + Math.random() * (h - 26), v: 8 + 10 * clamp(P.spF, 0.2, 2), rg: Math.random() < clamp(P.rgd * 120 + 0.02, 0, 0.8), life: 1 });
  E.q = E.q.filter(q => { if (run) { q.x += q.v * dt * (q.rg ? 0.5 : 1); if (q.rg && Math.random() < clamp(P.rp * (1 - P.inf), 0, 1.5) * dt * 0.8) q.life = 0; }
    if (q.life <= 0 || q.x > W) return false; if (q.rg) { g.strokeStyle = 'rgba(255,200,120,.85)'; g.lineWidth = 1; g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * 1.047; g.moveTo(q.x, q.y); g.lineTo(q.x + Math.cos(a) * 2.4, q.y + Math.sin(a) * 2.4); } g.stroke(); }
    else { g.fillStyle = 'rgba(255,90,110,.75)'; g.beginPath(); g.ellipse(q.x, q.y, 1.9, 1.3, 0, 0, 6.283); g.fill(); } return true; });
  // red-pulp macrophages, haem-laden ones darken (haem oxygenase behind)
  const hl = clamp(P.heme / 0.004, 0, 1.5);
  for (let i = 0; i < Math.round(10 * clamp(P.rp * (1 - P.inf), 0, 1.6)); i++) { const x = 10 + ((i * 0.618) % 1) * (W - 20), y = 20 + ((i * 0.377) % 1) * (h - 30); g.beginPath(); g.arc(x, y, 3.2, 0, 6.283); g.fillStyle = `rgba(${210 - 90 * hl},${150 - 80 * hl},${90 - 40 * hl},.75)`; g.fill(); }
  // platelet reservoir (right): dots ∝ pooled platelets; the capsule squeezes when it contracts
  const px = w * 0.875, py = h * 0.58, rx = Math.min(w * 0.1, 26) * (1 - 0.25 * P.ctrF), ry = Math.min(h * 0.32, 34) * (1 - 0.25 * P.ctrF);
  g.beginPath(); g.ellipse(px, py, rx, ry, 0, 0, 6.283); g.fillStyle = 'rgba(40,20,26,.75)'; g.fill(); g.strokeStyle = `rgba(255,180,110,${.3 + .5 * P.ctrF})`; g.lineWidth = 1 + 2 * P.ctrF; g.stroke();
  const np = Math.round(clamp(P.pool / 6, 0, 70));
  g.fillStyle = 'rgba(255,179,107,.8)'; for (let i = 0; i < np; i++) { const a = i * 2.399, d = Math.sqrt((i + .5) / Math.max(1, np)); g.beginPath(); g.arc(px + Math.cos(a) * rx * d * .85, py + Math.sin(a) * ry * d * .85, .9, 0, 6.283); g.fill(); }
}

function plot(cv, hist, series) {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = r.width, h = r.height;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);

  const n = hist.t.length; if (n < 2) return;

    const a = hist[s[0]]; let lo = s[2], hi = s[3]; const lg = s[4];

    g.beginPath();
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * (w - 2) + 1, y = h - 2 - clamp((f(a[i]) - lo) / (hi - lo), 0, 1) * (h - 4); if (i) g.lineTo(x, y); else g.moveTo(x, y); }

    const ly = h - 2 - clamp((f(a[n - 1]) - lo) / (hi - lo), 0, 1) * (h - 4);

  }
}

    hideOv(); if (!UI.started) { UI.started = true; auInit(); setTimeout(() => sfx('boot'), 30); } else setSpeed(was);
  };
}
function gameOver() {
  const S = UI.S, o = S.over, st = S.stats; if (UI.overShown) return; UI.overShown = true; sfx('over');
  if (o.score > UI.best) { UI.best = o.score; store.set('sk_best', UI.best); }
  showOv(`<div class="card"><div class="sub" style="margin:0">system halt · day ${Math.floor((S.t + 6) / 24) + 1}</div><h1 style="font-size:19px">${o.why === 'ENERGY' ? 'ENERGY DEPLETED' : 'BRAIN FAILURE'}</h1>
<div class="cause">${esc(CAUSE[o.cause] || o.cause)}</div><div class="big">${o.score}</div>
<div class="grid2"><div><em>days</em><b>${(S.t / 24).toFixed(1)}</b></div><div><em>phases</em><b>${st.phases}</b></div><div><em>best</em><b>${UI.best}</b></div>
<div><em>eradicated</em><b>${st.cleared}</b></div><div><em>tumours</em><b>${st.tumorsKilled}/${st.tumorsBorn}</b></div><div><em>variants</em><b>${st.variants}</b></div>
<div><em>commits</em><b>${st.commits}</b></div><div><em>edit kcal</em><b>${fmt(st.editE * SK.KCAL)}</b></div><div><em>mutations</em><b>${st.muts}</b></div></div>
<canvas id="ovCh"></canvas><div class="seedrow"><span>seed ${S.seed.toString(16)}</span><span style="margin-left:auto">peak ${st.peakT.toFixed(1)}°C</span></div>
<button class="btn ghost" id="ovLog">EXPORT CASE RECORD · HTML</button><div class="seedrow" id="ovLogAlt" style="display:none"><button class="btn ghost" id="ovShare" style="flex:1">SAVE AGAIN / SHARE</button></div>
<button class="btn" id="ovGo">REBOOT</button></div>`);
  plot($('#ovCh'), S.hist, CH[0][1]);
  $('#ovLog').onclick = e => exportRecord(e.currentTarget);
  $('#ovShare').onclick = () => shareRecord();
  $('#ovGo').onclick = () => { hideOv(); newRun(); UI.started = true; sfx('boot'); };
}

/* ---------- run control ---------- */
function newRun() {
  const seed = ((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  UI.S = SK.newGame(seed); UI.wall0 = Date.now(); UI.started = false; UI.overShown = false; UI.acc = 0; UI.memT = 0; UI.warn = {}; OD.k = null;
  ED.draft = {}; ED.costs = {}; ED.undoBy = {}; ED.sel = { li: 0, ti: -1 }; ED.inspH = null; UI.detH = null;
  for (const ty of TYPES) syncDraft(ty);
  BD.parts.length = 0; $('#phc').dataset.k = ''; $('#scope').innerHTML = '';
  TQ.length = 0; { const tk = $('#tick'); if (tk) tk.className = ''; }
  if (ICU.built) {
    for (const L of ICU.ch) { if (L.g) L.g.clearRect(0, 0, L.w, L.h); L.x = 0; L.y = L.h / 2; }
    Object.assign(ICU.W, { t: 0, tb: 0, rr: 0.85, rFired: false, asy: 0, rph: 0 }); ICU.numT = 0; ICU.labT = 0; ICU.labH = ''; ICU.alarms = []; ICU.alT = 0;
  }
  Object.assign(ECG, { x: 0, tb: 0, rr: .85, t: 0, rFired: false, asy: 0 });
  updHUD(); updOrgans(); renderDetail(true);
  if (UI.view === 'code') renderEditor(true); else if (UI.view === 'codex') renderCodex();
  setSpeed(1);
}
function afterTicks() {
  const S = UI.S;
  pumpEvents(); updHUD(); updOrgans(); renderDetail(); tickEditor();
  if (UI.view === 'scope') renderScope();
  if (S.over) gameOver();
}
function frame(now) {
  requestAnimationFrame(frame);
  const S = UI.S; if (!S) return;
  const dt = Math.min(250, now - (UI.last || now)); UI.last = now;
  if (UI.started && !S.over && UI.speed > 0 && !document.hidden) {
    UI.acc += dt * SPEEDS[UI.speed] / 1000;
    let n = 0;
    while (UI.acc >= 1 && n < 10) { SK.tick(S); UI.acc -= 1; n++; if (S.over) break; }
    if (UI.acc > 3) UI.acc = 0;
    if (n) afterTicks();
  }
  if (S.over && !UI.overShown) afterTicks();
  if (UI.wide || UI.view === 'soma') { drawBody(now); if (UI.selC === 'CAR') drawECG(now); else if (UI.selC === 'ALV') drawAlv(now); else if (UI.selC === 'SRN') drawAdr(now); else if (UI.selC === 'THY') drawThy(now); else if (UI.selC === 'LOB') drawLob(now); else if (UI.selC === 'SPN') drawSpn(now); }
  if (UI.view === 'icu') drawICU(now);
  auTick(S);
}
function onKey(e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if ($('#ov').classList.contains('on')) {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); const b = $('#ov .btn:not(.ghost)') || $('#ov .btn'); if (b) b.click(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); setSpeed(UI.speed ? 0 : (UI.prevSpeed || 1)); return; }
  if (k === 'Escape') { edFocus(false); return; }
  // on a wide screen the editor shares the screen with the body, so it takes keys only after it has been touched
  const edKeys = UI.view === 'code' && (!UI.wide || ED.kbd);
  if (k >= '1' && k <= '3' && !edKeys) { UI.prevSpeed = +k; setSpeed(+k); return; }
  if (!edKeys) return;
  const d = ED.draft[ED.type], s = ED.sel; if (!d) return;
  const sl = d[s.li], st = sl && s.ti >= 0 ? sl.toks[s.ti] : null, onNum = !!st && TK[st].cls === 'num';
  const mv = () => { ED.nb = null; renderCode(); renderInsp(); };   // leaving a number closes its edit buffer
  if (k === 'Backspace') { e.preventDefault(); if (onNum && ED.nb) numKey('⌫'); else tool('del'); }
  else if (k === 'Enter') { e.preventDefault(); tool('nl'); }
  else if (k === 'ArrowLeft') { e.preventDefault(); s.ti = Math.max(-1, s.ti - 1); mv(); }
  else if (k === 'ArrowRight') { e.preventDefault(); s.ti = Math.min(d[s.li].toks.length - 1, s.ti + 1); mv(); }
  else if (k === 'ArrowUp') { e.preventDefault(); s.li = Math.max(0, s.li - 1); s.ti = Math.min(s.ti, d[s.li].toks.length - 1); mv(); }
  else if (k === 'ArrowDown') { e.preventDefault(); s.li = Math.min(d.length - 1, s.li + 1); s.ti = Math.min(s.ti, d[s.li].toks.length - 1); mv(); }
  else if ((k >= '0' && k <= '9') || k === '.') numKey(k);
  else if (k === '-' && onNum && ED.nb && !ED.nb.buf) numKey('±');
  else if (KEY_TOK[k] && !e.ctrlKey && !e.metaKey) typeTok(KEY_TOK[k]);
  else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); tool('undo'); }
}
function edFocus(on) { if (ED.kbd === on) return; ED.kbd = on; document.body.classList.toggle('edk', on); }
const KEY_TOK = { '+': 'ADD', '-': 'SUB', '*': 'MUL', '/': 'DIV', '<': 'LT', '>': 'GT', '=': 'EQ', '(': 'LP', ')': 'RP', '&': 'AND', '|': 'OR', '!': 'NOT' };
function init() {
  buildSprite(); buildHUD(); buildSoma(); buildEditor();
  UI.wide = window.matchMedia('(min-width: 980px)').matches; document.body.classList.toggle('wide', UI.wide);
  newRun();
  setView(UI.wide ? 'code' : 'soma');
  resizeBody(); showTitle();
  document.addEventListener('keydown', onKey);
  document.addEventListener('pointerdown', e => edFocus(!!(e.target && e.target.closest && e.target.closest('#v-code'))), true);
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__SOMA = { UI, ED, SK, AU, SFX, sfx, exportLog: () => exportRecord(null), buildRecordHTML };

})();
